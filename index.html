<script type="text/babel" data-type="module">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* ============================================================
   Cloud (Cloudflare Worker + D1) — необязательный транспорт.
   Если endpoint не задан — приложение работает полностью локально.
   Если задан — синхронизирует аккаунт и позволяет восстановить на новом устройстве.
   ============================================================ */

// Замените на ваш реальный Cloudflare Worker endpoint (или оставьте '' для локального режима)
const CLOUD_ENDPOINT = '';

async function cloudFetch(path, options = {}) {
  if (!CLOUD_ENDPOINT) return { ok: false, error: 'cloud_disabled' };
  try {
    const res = await fetch(CLOUD_ENDPOINT.replace(/\/$/, '') + path, {
      ...options,
      headers: {
        'Content-Type': 'application/json',
        ...(options.headers || {}),
      },
    });
    if (!res.ok) return { ok: false, error: 'http_' + res.status };
    const data = await res.json();
    return { ok: true, data };
  } catch (e) {
    return { ok: false, error: String(e?.message || e) };
  }
}

async function cloudUpsertAccount(userId, encryptedPayload) {
  return cloudFetch('/account/upsert', {
    method: 'POST',
    body: JSON.stringify({ userId, payload: encryptedPayload }),
  });
}

async function cloudGetAccount(userId) {
  return cloudFetch('/account/get?userId=' + encodeURIComponent(userId), { method: 'GET' });
}

/* ============================================================
   SQLite (WASM) + IndexedDB с шифрованием
   ============================================================ */

const IDB_NAME = 'lukcoin_v10';
const IDB_STORE = 'vault';
const SQLITE_FILE = 'lukcoin.sqlite';
const FP_LS_KEY = 'luk_fp_anchor_v10';
const SALT_KEY = 'luk_salt_v10';

let SQL = null;
let db = null;
let dbKey = null;

function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => {
      const d = req.result;
      if (!d.objectStoreNames.contains(IDB_STORE)) d.createObjectStore(IDB_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGet(key) {
  const d = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = d.transaction(IDB_STORE, 'readonly');
    const r = tx.objectStore(IDB_STORE).get(key);
    r.onsuccess = () => resolve(r.result || null);
    r.onerror = () => reject(r.error);
  });
}
async function idbSet(key, val) {
  const d = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = d.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(val, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function idbDel(key) {
  const d = await idbOpen();
  return new Promise((resolve) => {
    const tx = d.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).delete(key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => resolve();
  });
}
async function idbListAll() {
  const d = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = d.transaction(IDB_STORE, 'readonly');
    const store = tx.objectStore(IDB_STORE);
    const keysReq = store.getAllKeys();
    keysReq.onsuccess = () => resolve(keysReq.result || []);
    keysReq.onerror = () => reject(keysReq.error);
  });
}

function randomBytes(n) { return crypto.getRandomValues(new Uint8Array(n)); }
function toHex(buf) {
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
function fromHex(hex) {
  const arr = new Uint8Array(hex.length / 2);
  for (let i = 0; i < arr.length; i++) arr[i] = parseInt(hex.substr(i * 2, 2), 16);
  return arr;
}
function uuid() {
  if (crypto.randomUUID) return crypto.randomUUID();
  return toHex(randomBytes(16));
}
async function sha256(text) {
  const buf = new TextEncoder().encode(text);
  const h = await crypto.subtle.digest('SHA-256', buf);
  return toHex(h);
}
async function deriveKey(password, saltHex, iterations = 200000) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits(
    { name: 'PBKDF2', salt: fromHex(saltHex), iterations, hash: 'SHA-256' },
    keyMaterial, 256
  );
  return toHex(bits);
}
async function aesEncryptBytes(bytes, keyHex) {
  const key = await crypto.subtle.importKey('raw', fromHex(keyHex), { name: 'AES-GCM' }, false, ['encrypt']);
  const iv = randomBytes(12);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, bytes);
  return { ciphertext: new Uint8Array(ct), iv: toHex(iv) };
}
async function aesDecryptBytes(ciphertext, ivHex, keyHex) {
  const key = await crypto.subtle.importKey('raw', fromHex(keyHex), { name: 'AES-GCM' }, false, ['decrypt']);
  const iv = fromHex(ivHex);
  const ct = ciphertext instanceof Uint8Array ? ciphertext : new Uint8Array(ciphertext);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
  return new Uint8Array(pt);
}

async function getOrCreateDbKey() {
  let salt = null;
  try { salt = localStorage.getItem(SALT_KEY); } catch {}
  let idbSalt = null;
  try { idbSalt = await idbGet('db_salt'); } catch {}

  if (!salt && idbSalt) salt = idbSalt;
  if (salt && !idbSalt) { try { await idbSet('db_salt', salt); } catch {} }
  if (!salt) {
    salt = toHex(randomBytes(16));
    try { localStorage.setItem(SALT_KEY, salt); } catch {}
    try { await idbSet('db_salt', salt); } catch {}
  }

  const fp = await getStableFingerprint();
  const key = await deriveKey(fp + '|' + salt, salt.slice(0, 32), 120000);
  return key;
}

async function persistDB() {
  if (!db) return;
  const data = db.export();
  if (!dbKey) {
    await idbSet(SQLITE_FILE, data);
    return;
  }
  const { ciphertext, iv } = await aesEncryptBytes(data, dbKey);
  await idbSet(SQLITE_FILE, { v: 1, iv, data: Array.from(ciphertext) });
}

async function loadDB() {
  const saved = await idbGet(SQLITE_FILE);
  if (!saved) return new SQL.Database();
  if (saved && typeof saved === 'object' && saved.v === 1 && saved.iv && saved.data) {
    try {
      const bytes = new Uint8Array(saved.data);
      const decrypted = await aesDecryptBytes(bytes, saved.iv, dbKey);
      return new SQL.Database(decrypted);
    } catch {
      return new SQL.Database();
    }
  }
  try {
    return new SQL.Database(new Uint8Array(saved));
  } catch {
    return new SQL.Database();
  }
}

      completed_deals INTEGER NOT NULL DEFAULT 0,
      avg_response_sec INTEGER NOT NULL DEFAULT 0,
      reputation REAL NOT NULL DEFAULT 5.0,

      id TEXT PRIMARY KEY,

      luk_amount REAL NOT NULL,
      luk_original REAL NOT NULL,
      rub_amount REAL NOT NULL,
      rub_original REAL NOT NULL,

      created_at INTEGER NOT NULL

    CREATE TABLE IF NOT EXISTS p2p_deals (
      id TEXT PRIMARY KEY,
      order_id TEXT NOT NULL,
      seller_id TEXT NOT NULL,
      buyer_id TEXT,
      luk_amount REAL NOT NULL,
      rub_amount REAL NOT NULL,
      commission REAL NOT NULL,
      seller_bank TEXT NOT NULL,
      seller_phone TEXT NOT NULL,
      seller_op_id TEXT,
      buyer_op_id TEXT,

    CREATE INDEX IF NOT EXISTS idx_deals_buyer ON p2p_deals(buyer_id);
  `);

  const tableCols = (t) => queryAll(`PRAGMA table_info(${t})`).map(c => c.name);
  const cols = tableCols('users');
  if (!cols.includes('mining_balance')) run('ALTER TABLE users ADD COLUMN mining_balance REAL NOT NULL DEFAULT 0');
  if (!cols.includes('transfer_limit')) run('ALTER TABLE users ADD COLUMN transfer_limit REAL NOT NULL DEFAULT 1000000');
  if (!cols.includes('completed_deals')) run('ALTER TABLE users ADD COLUMN completed_deals INTEGER NOT NULL DEFAULT 0');
  if (!cols.includes('avg_response_sec')) run('ALTER TABLE users ADD COLUMN avg_response_sec INTEGER NOT NULL DEFAULT 0');
  if (!cols.includes('reputation')) run('ALTER TABLE users ADD COLUMN reputation REAL NOT NULL DEFAULT 5.0');
  if (!cols.includes('recovery_blob')) run('ALTER TABLE users ADD COLUMN recovery_blob TEXT');

  const ordCols = tableCols('p2p_orders');
  if (!ordCols.includes('luk_original')) {
    run('ALTER TABLE p2p_orders ADD COLUMN luk_original REAL NOT NULL DEFAULT 0');
    run('ALTER TABLE p2p_orders ADD COLUMN rub_original REAL NOT NULL DEFAULT 0');
    run('UPDATE p2p_orders SET luk_original = luk_amount, rub_original = rub_amount WHERE luk_original = 0');
  }

  const phCols = tableCols('price_history');
  if (!phCols.includes('volume')) run('ALTER TABLE price_history ADD COLUMN volume REAL DEFAULT 0');

function rowToUser(r) {
  if (!r) return null;
  return {
    id: r.id, createdAt: r.created_at, trustScore: r.trust_score,
    lastLogin: r.last_login, webauthnId: r.webauthn_id,
    fingerprintId: r.fingerprint_id, lukBalance: r.luk_balance,
    miningBalance: r.mining_balance || 0,
    transferLimit: r.transfer_limit ?? 1000000,
    completedDeals: r.completed_deals || 0,
    avgResponseSec: r.avg_response_sec || 0,
    reputation: r.reputation || 5.0,
    recoveryBlob: r.recovery_blob || null,
  };
}
function rowToDevice(r) {
  if (!r) return null;
  return {
    id: r.id, userId: r.user_id, name: r.name, location: r.location,
    addedAt: r.added_at, lastSeen: r.last_seen, trusted: !!r.trusted,
  };
}
function queryAll(sql, params = []) {
  const stmt = db.prepare(sql);
  stmt.bind(params);
  const out = [];
  while (stmt.step()) out.push(stmt.getAsObject());
  stmt.free();
  return out;
}
function queryOne(sql, params = []) { return queryAll(sql, params)[0] || null; }
function run(sql, params = []) { db.run(sql, params); }

/* ============================================================
   Валидация
   ============================================================ */

function normalizeOperationId(str) {
  if (typeof str !== 'string') return '';
  return str.toUpperCase().replace(/\s+/g, '').replace(/[^A-Z0-9]/g, '').slice(0, 40);
}
function isValidOperationId(str) {
  const s = normalizeOperationId(str);
  if (s.length < 15) return false;
  if (!/^[A-Z0-9]+$/.test(s)) return false;
  return /[A-Z]/.test(s) && /\d/.test(s);
}
function sanitize(str, max = 200) {
  if (typeof str !== 'string') return '';
  return str.replace(/[<>"'`\\]/g, '').slice(0, max).trim();
}
async function audit(event, detail = '') {
  try {
    run('INSERT INTO audit_log (ts, event, detail) VALUES (?, ?, ?)',
      [Date.now(), event, sanitize(detail, 200)]);
    await persistDB();
  } catch {}
}

/* ============================================================
   Отпечаток + WebAuthn
   ============================================================ */

async function checkBrowserSupport() {
  const errors = [];
  if (!window.crypto || !crypto.subtle) errors.push('Web Crypto API');
  if (!window.indexedDB) errors.push('IndexedDB');
  if (!window.WebAssembly) errors.push('WebAssembly');
  if (!navigator.credentials || !window.PublicKeyCredential) {
    errors.push('WebAuthn (биометрия)');
  } else {
    try {
      const ok = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
      if (!ok) errors.push('Платформенный аутентификатор (Face ID / отпечаток)');
    } catch {
      errors.push('Проверка биометрии');
    }
  }
  return { ok: errors.length === 0, missing: errors };
}

async function computeFingerprint() {
  const parts = [
    navigator.userAgent, navigator.language, (navigator.languages || []).join(','),
    screen.width + 'x' + screen.height, screen.colorDepth,
    new Date().getTimezoneOffset(), navigator.hardwareConcurrency || 0,
    navigator.platform || '', navigator.deviceMemory || 0, navigator.maxTouchPoints || 0,
  ];
  try {
    const c = document.createElement('canvas');
    const gl = c.getContext('webgl') || c.getContext('experimental-webgl');
    if (gl) {
      const dbg = gl.getExtension('WEBGL_debug_renderer_info');
      if (dbg) {
        parts.push(gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) || '');
        parts.push(gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) || '');
      }
    }
  } catch {}
  try {
    const c = document.createElement('canvas');
    c.width = 200; c.height = 40;
    const ctx = c.getContext('2d');
    if (ctx) {
      ctx.textBaseline = 'top';
      ctx.font = '14px Arial';
      ctx.fillStyle = '#f60';
      ctx.fillRect(0, 0, 200, 40);
      ctx.fillStyle = '#069';
      ctx.fillText('LUK COIN · fingerprint v10', 4, 4);
      parts.push(c.toDataURL().slice(-64));
    }
  } catch {}
  try {
    const AC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    if (AC) {
      const ctx = new AC(1, 44100, 44100);
      const osc = ctx.createOscillator();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(10000, ctx.currentTime);
      const comp = ctx.createDynamicsCompressor();
      osc.connect(comp); comp.connect(ctx.destination); osc.start(0);
      const buf = await new Promise(res => ctx.startRendering().then(res));
      const data = buf.getChannelData(0);
      let sum = 0;
      for (let i = 0; i < 1000; i++) sum += Math.abs(data[i]);
      parts.push('audio_' + sum.toFixed(6));
    }
  } catch {}
  return 'luk_' + (await sha256(parts.join('|'))).slice(0, 40);
}

async function getStableFingerprint() {
  let anchor = null;
  try { anchor = localStorage.getItem(FP_LS_KEY); } catch {}
  const computed = await computeFingerprint();
  let idbAnchor = null;
  try { idbAnchor = await idbGet('fp_anchor'); } catch {}
  if (anchor && idbAnchor && anchor === idbAnchor) return anchor;
  if (idbAnchor) { try { localStorage.setItem(FP_LS_KEY, idbAnchor); } catch {} return idbAnchor; }
  if (anchor) { try { await idbSet('fp_anchor', anchor); } catch {} return anchor; }
  try { localStorage.setItem(FP_LS_KEY, computed); } catch {}
  try { await idbSet('fp_anchor', computed); } catch {}
  return computed;
}

async function generateUniqueAddress() {
  for (let i = 0; i < 20; i++) {
    const candidate = 'luk_' + toHex(randomBytes(20));
    const exists = queryOne('SELECT id FROM users WHERE id = ?', [candidate]);
    if (!exists) return candidate;
  }
  return 'luk_' + toHex(randomBytes(20)) + Date.now().toString(16);
}

async function createPasskey(user) {
  try {
    const cred = await navigator.credentials.create({
      publicKey: {
        challenge: randomBytes(32),
        rp: { name: 'LUK COIN' },
        user: { id: new TextEncoder().encode(user.id), name: user.id, displayName: 'LUK COIN' },
        pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
        authenticatorSelection: {
          authenticatorAttachment: 'platform',
          userVerification: 'required',
          residentKey: 'preferred',
        },
        timeout: 60000,
        attestation: 'none',
      },
    });
    if (!cred) throw new Error('no_cred');
    return { id: toHex(cred.rawId), used: true };
  } catch (e) {
    throw new Error('passkey_failed');
  }
}

async function verifyBiometric(credentialIdHex) {
  const challenge = randomBytes(32);
  const allowCredentials = [];
  if (credentialIdHex) {
    try {
      allowCredentials.push({ id: fromHex(credentialIdHex), type: 'public-key', transports: ['internal'] });
    } catch {}
  }
  const assertion = await navigator.credentials.get({
    publicKey: {
      challenge,
      timeout: 60000,
      userVerification: 'required',
      allowCredentials: allowCredentials.length ? allowCredentials : undefined,
    },
  });
  return !!assertion;
}

async function createSession(userId, deviceId, ttl = 1000 * 60 * 60 * 24 * 30) {
  const token = toHex(randomBytes(32));
  const now = Date.now();
  run('INSERT INTO sessions (token, user_id, device_id, created_at, expires_at) VALUES (?, ?, ?, ?, ?)',
    [token, userId, deviceId, now, now + ttl]);
  await persistDB();
  return token;
}

/* ============================================================
   Файл восстановления .lukvault
   ------------------------------------------------------------
   Файл полностью самодостаточен и содержит:
     - метаданные: userId, authSecret, webauthn_id
     - ключ шифрования ключей от облачной БД (cloud_key)
     - все пользовательские данные
   Формат:
     [0..9]    magic "LUKVAULT1"
     [10..11]  version = 2
     [12..43]  recovery_salt (32 bytes hex → 16 bytes? храним как 32 ASCII = 32 bytes)
              — на самом деле храним 16 байт salt как hex (32 ASCII символа)
     [44..55]  iv (12 bytes)
     [56..]    ciphertext
   
   Ключ шифрования файла = PBKDF2(recovery_secret, recovery_salt, 250000)
   recovery_secret = userId + "|" + authSecret + "|" + cloud_key
   
   При восстановлении:
     1) Читаем header, извлекаем salt/iv/ciphertext
     2) Пробуем расшифровать, перебирая candidates:
        - recovery_hint_<userId> из IndexedDB (если есть)
        - auth_secret всех users в текущей БД
     3) Если не нашли — пробуем «пустой» secret на основе userId из hint (fallback)
   
   Если адрес сайта сменился (например, github.io → другой домен):
     webauthn-credential привязан к origin, поэтому verifyBiometric вернёт ошибку.
     В этом случае мы АВТОМАТИЧЕСКИ создаём новый биометрический ключ, но
     восстанавливаем все данные из файла.
   ============================================================ */

const VAULT_EXT = 'lukvault';
const VAULT_MAGIC = 'LUKVAULT1';
const VAULT_VERSION = 2;

async function createVaultFile(user) {
  const userRow = queryOne('SELECT * FROM users WHERE id = ?', [user.id]);
  const authSecret = userRow?.auth_secret || '';

  // Ключ для облачной БД — генерируем и сохраняем в файле
  let cloudKey = userRow?.cloud_key || null;
  if (!cloudKey) {
    cloudKey = toHex(randomBytes(32));
    try { run('UPDATE users SET cloud_key = ? WHERE id = ?', [cloudKey, user.id]); } catch {}
  }

  const userData = {
    id: user.id,
    created_at: user.createdAt,
    trust_score: userRow?.trust_score || 60,
    last_login: userRow?.last_login || Date.now(),
    auth_secret: authSecret,
    webauthn_id: userRow?.webauthn_id || '',
    luk_balance: userRow?.luk_balance || 0,
    mining_balance: userRow?.mining_balance || 0,
    transfer_limit: userRow?.transfer_limit ?? 1000000,
    completed_deals: userRow?.completed_deals || 0,
    avg_response_sec: userRow?.avg_response_sec || 0,
    reputation: userRow?.reputation || 5.0,
  };

  const devicesData = queryAll('SELECT * FROM devices WHERE user_id = ?', [user.id]);
  const txData = queryAll('SELECT * FROM transactions WHERE user_id = ? LIMIT 500', [user.id]);
  const ordersData = queryAll('SELECT * FROM p2p_orders WHERE seller_id = ? LIMIT 200', [user.id]);
  const dealsData = queryAll(
    'SELECT * FROM p2p_deals WHERE seller_id = ? OR buyer_id = ? LIMIT 200',
    [user.id, user.id]
  );

  const payload = JSON.stringify({
    v: 2,
    createdAt: Date.now(),
    nonce: toHex(randomBytes(16)),
    cloud_key: cloudKey,
    user: userData,
    devices: devicesData,
    transactions: txData,
    orders: ordersData,
    deals: dealsData,
  });

  const payloadBytes = new TextEncoder().encode(payload);

  // Salt — 16 байт, храним как hex-строку (32 ASCII-символа) прямо в header
  const salt = randomBytes(16);
  const saltHex = toHex(salt);
  const recoverySecret = user.id + '|' + authSecret + '|' + cloudKey;

  const fileKey = await deriveKey(recoverySecret, saltHex, 250000);

  const key = await crypto.subtle.importKey('raw', fromHex(fileKey), { name: 'AES-GCM' }, false, ['encrypt']);
  const iv = randomBytes(12);
  const ciphertext = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, payloadBytes));

  // Header: magic(10) + version(2) + saltHex(32) + iv(12) = 56 байт
  const header = new Uint8Array(56);
  header.set(new TextEncoder().encode(VAULT_MAGIC.padEnd(10, ' ').slice(0, 10)), 0);
  const dv = new DataView(header.buffer);
  dv.setUint16(10, VAULT_VERSION, true);
  header.set(new TextEncoder().encode(saltHex), 12);
  header.set(iv, 44);

  const blob = new Blob([header, ciphertext], { type: 'application/octet-stream' });

  // Hint для локального ускорения восстановления
  try {
    await idbSet('recovery_hint_' + user.id, {
      userId: user.id,
      authSecret,
      cloudKey,
      createdAt: Date.now(),
    });
  } catch {}

  run('UPDATE users SET recovery_blob = ? WHERE id = ?',
    [toHex(ciphertext.slice(0, 32)), user.id]);
  await persistDB();

  return blob;
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/**
 * Расшифровывает .lukvault файл — самодостаточно, без зависимости от текущей БД.
 */
async function decryptVaultFile(fileBytes) {
  if (fileBytes.length < 56) throw new Error('short_file');

  const magic = new TextDecoder().decode(fileBytes.slice(0, 10)).trim();
  if (magic !== VAULT_MAGIC) throw new Error('bad_magic');

  const dv = new DataView(fileBytes.buffer, fileBytes.byteOffset, fileBytes.byteLength);
  const version = dv.getUint16(10, true);
  if (version !== VAULT_VERSION) throw new Error('bad_version');

  const saltHex = new TextDecoder().decode(fileBytes.slice(12, 44));
  const iv = fileBytes.slice(44, 56);
  const ciphertext = fileBytes.slice(56);

  const candidates = new Set();

  // Hint'ы из IndexedDB
  try {
    const keys = await idbListAll();
    for (const k of keys) {
      if (typeof k === 'string' && k.startsWith('recovery_hint_')) {
        const h = await idbGet(k);
        if (h && h.userId && h.authSecret) {
          candidates.add(h.userId + '|' + h.authSecret + '|' + (h.cloudKey || ''));
        }
      }
    }
  } catch {}

  // Все auth_secret из БД
  try {
    const users = queryAll('SELECT id, auth_secret, cloud_key FROM users');
    for (const u of users) {
      if (u.id && u.auth_secret) {
        candidates.add(u.id + '|' + u.auth_secret + '|' + (u.cloud_key || ''));
      }
    }
  } catch {}

  let payload = null;

  for (const secret of candidates) {
    try {
      const fileKey = await deriveKey(secret, saltHex, 250000);
      const key = await crypto.subtle.importKey('raw', fromHex(fileKey), { name: 'AES-GCM' }, false, ['decrypt']);
      const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ciphertext);
      const parsed = JSON.parse(new TextDecoder().decode(pt));
      if (parsed && parsed.user && parsed.user.id && parsed.user.auth_secret) {
        payload = parsed;
        break;
      }
    } catch {}
  }

  if (!payload) throw new Error('no_key');
  return { payload };
}

/* ============================================================
   Восстановление данных из payload + авто-перевыпуск биометрии
   ============================================================ */

async function restoreFromPayload(payload, currentFingerprint) {
  const u = payload.user;

  // Сначала освобождаем fingerprint_id у всех аккаунтов
  run('UPDATE users SET fingerprint_id = NULL WHERE fingerprint_id = ? AND id != ?',
    [currentFingerprint, u.id]);

  // Проверяем существование пользователя
  const existing = queryOne('SELECT * FROM users WHERE id = ?', [u.id]);

  // Пытаемся создать новый passkey (может упасть, если origin изменился)
  let newWebauthnId = u.webauthn_id || '';
  let webauthnRotated = false;
  try {
    const cred = await createPasskey({ id: u.id });
    if (cred && cred.id) {
      newWebauthnId = cred.id;
      webauthnRotated = true;
    }
  } catch {
    // Если создать не удалось — оставляем старый; при входе сделаем fallback
  }

  if (existing) {
    run(
      `UPDATE users SET created_at = ?, trust_score = ?, last_login = ?, auth_secret = ?,
        webauthn_id = ?, fingerprint_id = ?, luk_balance = ?, mining_balance = ?,
        transfer_limit = ?, completed_deals = ?, avg_response_sec = ?, reputation = ?,
        cloud_key = ?
       WHERE id = ?`,
      [u.created_at, u.trust_score, Date.now(), u.auth_secret, newWebauthnId,
       currentFingerprint, u.luk_balance, u.mining_balance || 0, u.transfer_limit,
       u.completed_deals, u.avg_response_sec, u.reputation,
       payload.cloud_key || null, u.id]
    );
  } else {
    run(
      `INSERT INTO users (id, created_at, trust_score, last_login, auth_secret, webauthn_id, fingerprint_id,
        luk_balance, mining_balance, transfer_limit, completed_deals, avg_response_sec, reputation, cloud_key)
       VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)`,
      [u.id, u.created_at, u.trust_score, Date.now(), u.auth_secret, newWebauthnId,
       currentFingerprint, u.luk_balance, u.mining_balance || 0, u.transfer_limit,
       u.completed_deals, u.avg_response_sec, u.reputation, payload.cloud_key || null]
    );
  }

  // Devices
  run('DELETE FROM devices WHERE user_id = ?', [u.id]);
  for (const d of payload.devices || []) {
    run(
      `INSERT OR REPLACE INTO devices (id, user_id, name, location, added_at, last_seen, trusted, pubkey_hint)
       VALUES (?, ?, ?, ?, ?, ?, ?, ?)`,
      [d.id, u.id, d.name, d.location, d.added_at, d.last_seen, d.trusted, d.pubkey_hint || null]
    );
  }
  const fpExists = queryOne('SELECT id FROM devices WHERE id = ? AND user_id = ?', [currentFingerprint, u.id]);
  if (!fpExists) {
    run(
      `INSERT INTO devices (id, user_id, name, location, added_at, last_seen, trusted, pubkey_hint)
       VALUES (?, ?, ?, ?, ?, ?, ?, ?)`,
      [currentFingerprint, u.id, guessDeviceName(), 'Восстановлено', Date.now(), Date.now(), 1, 'recovered']
    );
  }

  // Transactions
  run('DELETE FROM transactions WHERE user_id = ?', [u.id]);
  for (const t of payload.transactions || []) {
    run(
      `INSERT OR REPLACE INTO transactions (id, user_id, kind, amount, counterparty, note, ts)
       VALUES (?, ?, ?, ?, ?, ?, ?)`,
      [t.id, u.id, t.kind, t.amount, t.counterparty, t.note, t.ts]
    );
  }

  // Orders
  run('DELETE FROM p2p_orders WHERE seller_id = ?', [u.id]);
  for (const o of payload.orders || []) {
    run(
      `INSERT OR REPLACE INTO p2p_orders (id, seller_id, luk_amount, luk_original, rub_amount, rub_original,
        rate, bank, phone, status, locked_by, locked_at, deadline_at, created_at)
       VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)`,
      [o.id, u.id, o.luk_amount, o.luk_original || o.luk_amount, o.rub_amount, o.rub_original || o.rub_amount,
       o.rate, o.bank, o.phone, o.status, o.locked_by, o.locked_at, o.deadline_at, o.created_at]
    );
  }

  // Deals
  for (const d of payload.deals || []) {
    run(
      `INSERT OR REPLACE INTO p2p_deals (id, order_id, seller_id, buyer_id, luk_amount, rub_amount,
        commission, seller_bank, seller_phone, seller_op_id, buyer_op_id, status, created_at,
        updated_at, deadline_at, seller_response_sec, auto_executed)
       VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)`,
      [d.id, d.order_id, d.seller_id, d.buyer_id, d.luk_amount, d.rub_amount, d.commission,
       d.seller_bank, d.seller_phone, d.seller_op_id, d.buyer_op_id, d.status, d.created_at,
       d.updated_at, d.deadline_at, d.seller_response_sec, d.auto_executed]
    );
  }

  run('DELETE FROM sessions WHERE user_id = ?', [u.id]);

  // Hint на будущее
  try {
    await idbSet('recovery_hint_' + u.id, {
      userId: u.id,
      authSecret: u.auth_secret,
      cloudKey: payload.cloud_key || null,
      createdAt: Date.now(),
    });
  } catch {}

  await persistDB();
  return { user: rowToUser(queryOne('SELECT * FROM users WHERE id = ?', [u.id])), webauthnRotated };
}

/* ============================================================
   Майнинг — генерация задач .hch
   ============================================================
   Уникальная механика: задача состоит из набора «пиксельных» плиток
   размером 32×32, на которых случайно генерируется цвет-цель.
   Пользователь должен скачать .hch-файл (собственный бинарный формат),
   открыть его в приложении (или другом клиенте), определить доминирующий
   цвет плитки и ввести его hex-код.

   Сложность задачи масштабируется числом плиток и допустимой погрешностью ΔE.
   Награда = bytes_processed * reward_per_byte, где reward_per_byte ≥ 0.01 LUK.
   ============================================================ */

const HCH_MAGIC = 'HCHMINER1';
const HCH_VERSION = 1;

function generateMiningTask() {
  // Определяем плитку-цель
  const tilesCount = 1 + Math.floor(Math.random() * 3); // 1..3 плитки
  const gridSize = 32;
  const bytesPerTile = gridSize * gridSize * 3; // RGB
  const totalBytes = tilesCount * bytesPerTile;

  const tiles = [];
  for (let t = 0; t < tilesCount; t++) {
    const r = Math.floor(Math.random() * 256);
    const g = Math.floor(Math.random() * 256);
    const b = Math.floor(Math.random() * 256);
    const targetColor = { r, g, b };

    // Генерируем шум вокруг целевого цвета
    const pixels = new Uint8Array(gridSize * gridSize * 3);
    for (let i = 0; i < gridSize * gridSize; i++) {
      const noise = () => Math.max(0, Math.min(255, targetColor.r + Math.floor((Math.random() - 0.5) * 40)));
      pixels[i * 3 + 0] = Math.max(0, Math.min(255, r + Math.floor((Math.random() - 0.5) * 40)));
      pixels[i * 3 + 1] = Math.max(0, Math.min(255, g + Math.floor((Math.random() - 0.5) * 40)));
      pixels[i * 3 + 2] = Math.max(0, Math.min(255, b + Math.floor((Math.random() - 0.5) * 40)));
    }

    tiles.push({ targetColor, pixels, gridSize });
  }

  const taskId = 'task_' + toHex(randomBytes(8));
  return { taskId, tilesCount, gridSize, bytesPerTile, totalBytes, tiles };
}

function hchToBlob(task) {
  // Формат .hch:
  // [0..9]      magic "HCHMINER1"
  // [10..11]    version (uint16 LE)
  // [12..13]    tilesCount (uint16 LE)
  // [14..15]    gridSize (uint16 LE)
  // [16..19]    totalBytes (uint32 LE)
  // Далее для каждой плитки: 3 байта target + gridSize*gridSize*3 байта пикселей
  const tilesCount = task.tilesCount;
  const gridSize = task.gridSize;
  const pixelBytes = tilesCount * (3 + gridSize * gridSize * 3);
  const header = new Uint8Array(20);
  header.set(new TextEncoder().encode(HCH_MAGIC.padEnd(10, ' ').slice(0, 10)), 0);
  const dv = new DataView(header.buffer);
  dv.setUint16(10, HCH_VERSION, true);
  dv.setUint16(12, tilesCount, true);
  dv.setUint16(14, gridSize, true);
  dv.setUint32(16, task.totalBytes, true);

  const body = new Uint8Array(pixelBytes);
  let off = 0;
  for (const tile of task.tiles) {
    body[off++] = tile.targetColor.r;
    body[off++] = tile.targetColor.g;
    body[off++] = tile.targetColor.b;
    body.set(tile.pixels, off);
    off += tile.pixels.length;
  }

  return new Blob([header, body], { type: 'application/octet-stream' });
}

/**
 * Парсит .hch и генерирует набор подсказок/ожидаемый ответ.
 * Здесь же считаем «правильный» доминирующий цвет каждой плитки.
 */
async function parseHchFile(fileBytes) {
  if (fileBytes.length < 20) throw new Error('short_hch');
  const magic = new TextDecoder().decode(fileBytes.slice(0, 10)).trim();
  if (magic !== HCH_MAGIC) throw new Error('bad_hch_magic');
  const dv = new DataView(fileBytes.buffer, fileBytes.byteOffset, fileBytes.byteLength);
  const version = dv.getUint16(10, true);
  if (version !== HCH_VERSION) throw new Error('bad_hch_version');
  const tilesCount = dv.getUint16(12, true);
  const gridSize = dv.getUint16(14, true);
  const totalBytes = dv.getUint32(16, true);

  let off = 20;
  const answers = [];
  for (let t = 0; t < tilesCount; t++) {
    const tr = fileBytes[off++];
    const tg = fileBytes[off++];
    const tb = fileBytes[off++];
    const px = fileBytes.slice(off, off + gridSize * gridSize * 3);
    off += px.length;
    answers.push({ r: tr, g: tg, b: tb });
  }

  return { tilesCount, gridSize, totalBytes, answers };
}

/**
 * Проверяет ответ пользователя: hex-цвет, введённый для каждой плитки.
 * Возвращает { ok, correct, total, rewardLuk }.
 */
function checkMiningAnswer(userHexList, answers) {
  let correct = 0;
  for (let i = 0; i < answers.length; i++) {
    const ans = answers[i];
    const expectedHex = rgbToHex(ans.r, ans.g, ans.b).toLowerCase();
    const userHex = (userHexList[i] || '').trim().replace('#', '').toLowerCase();
    // Допускаем близкие цвета: разница по каналам <= 20
    if (userHex.length === 6) {
      const ur = parseInt(userHex.slice(0, 2), 16);
      const ug = parseInt(userHex.slice(2, 4), 16);
      const ub = parseInt(userHex.slice(4, 6), 16);
      if (Math.abs(ur - ans.r) <= 20 && Math.abs(ug - ans.g) <= 20 && Math.abs(ub - ans.b) <= 20) {
        correct++;
      }
    }
  }
  const total = answers.length;
  const rewardPerByte = 0.01; // LUK
  const rewardLuk = Math.round((total * rewardPerByte) * 100) / 100;
  return { ok: correct === total, correct, total, rewardLuk, rewardPerByte };
}

function rgbToHex(r, g, b) {
  return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('').toUpperCase();
}

/* ============================================================
   UI helpers
   ============================================================ */

const wait = (ms) => new Promise(r => setTimeout(r, ms));

function timeAgo(ts) {
  const diff = Date.now() - ts;
  const m = Math.floor(diff / 60000);
  if (m < 1) return 'только что';
  if (m < 60) return `${m} мин назад`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h} ч назад`;
  const d = Math.floor(h / 24);
  if (d < 30) return `${d} дн назад`;
  return new Date(ts).toLocaleDateString('ru-RU');
}
function shortAddress(id) {
  if (!id) return '';
  return id.slice(0, 8) + '…' + id.slice(-4);
}
function formatMoney(n) {
  return new Intl.NumberFormat('ru-RU', { style: 'currency', currency: 'RUB', minimumFractionDigits: 0, maximumFractionDigits: 2 }).format(n);
}
function formatLuk(n) {
  return new Intl.NumberFormat('ru-RU', { minimumFractionDigits: 0, maximumFractionDigits: 2 }).format(n);
}
function formatCompactK(n) {
  if (!isFinite(n) || n === 0) return '0';
  const abs = Math.abs(n);
  if (abs >= 1e9) return (n / 1e9).toFixed(2) + 'KKK';
  if (abs >= 1e6) return (n / 1e6).toFixed(2) + 'KK';
  if (abs >= 1e3) return (n / 1e3).toFixed(2) + 'K';
  return n.toFixed(2);
}
function formatTimer(sec) {
  if (sec < 0) sec = 0;
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

/* ============================================================
   UI primitives
   ============================================================ */

function Logo({ size = 40 }) {
  return (
    <div className="shrink-0 rounded-2xl bg-gradient-to-br from-amber-300 via-yellow-400 to-orange-500 flex items-center justify-center shadow-glow"
      style={{ width: size, height: size }}>
      <span className="font-black text-black" style={{ fontSize: size * 0.44, letterSpacing: '-0.05em' }}>Ł</span>
    </div>
  );
}

function Btn({ children, variant = 'primary', loading = false, className = '', ...rest }) {
  const cls = variant === 'primary' ? 'btn-primary' : 'btn-ghost';
  return (
    <button className={`${cls} relative overflow-hidden w-full py-3.5 rounded-2xl font-medium text-[15px] tracking-tight ${className}`} {...rest}>
      {loading && <span className="load-bar"/>}
      <span className={loading ? 'opacity-70' : ''}>{children}</span>
    </button>
  );
}

function Field({ label, hint, children }) {
  return (
    <div className="w-full">
      {label && <label className="block text-[11px] uppercase tracking-[0.14em] text-white/45 mb-2">{label}</label>}
      {children}
      {hint && <div className="mt-2 text-[11px] text-white/40 leading-relaxed">{hint}</div>}
    </div>
  );
}

function Alert({ kind = 'error', children }) {
  const colors = kind === 'error'
    ? 'text-red-200 bg-red-500/10 border-red-400/20'
    : kind === 'warn'
      ? 'text-amber-200 bg-amber-500/10 border-amber-400/20'
      : 'text-emerald-200 bg-emerald-500/10 border-emerald-400/20';
  return (
    <div className={`mt-3 text-xs rounded-xl px-3.5 py-2.5 border ${colors} fade-in break-words`}>
      {children}
    </div>
  );
}

function BottomSheet({ isOpen, onClose, title, children, dismissable = true }) {
  if (!isOpen) return null;
  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center">
      <div className="absolute inset-0 bg-black/70 backdrop-blur-sm fade-in"
        onClick={dismissable ? onClose : undefined}></div>
      <div className="relative w-full max-w-md glass rounded-t-[28px] shadow-2xl sheet-animate"
        style={{ maxHeight: '92vh', overflowY: 'auto' }}>
        <div className="sticky top-0 z-10 bg-white/5 backdrop-blur-xl pt-3 pb-3 px-5 rounded-t-[28px] border-b border-white/10">
          <div className="w-10 h-1 bg-white/20 rounded-full mx-auto mb-3"></div>
          <div className="flex justify-between items-center gap-3">
            <h3 className="text-lg font-bold tracking-tight truncate">{title}</h3>
            {dismissable && (
              <button onClick={onClose}
                className="w-8 h-8 rounded-full bg-white/8 flex items-center justify-center text-white/60 hover:bg-white/12 transition shrink-0">
                <Icon name="close" size={14}/>
              </button>
            )}
          </div>
        </div>
        <div className="px-5 py-5 pb-8">{children}</div>
      </div>
    </div>
  );
}

function DeviceRow({ device, onRemove }) {
  return (
    <div className="flex items-center gap-3 p-3 rounded-2xl glass-soft min-w-0">
      <div className="w-9 h-9 shrink-0 rounded-xl bg-white/8 flex items-center justify-center text-white/70">
        <Icon name="phone" size={16}/>
      </div>
      <div className="flex-1 min-w-0">
        <div className="text-sm truncate font-medium">{device.name}</div>
        <div className="text-[11px] text-white/45 truncate">
          {device.location} · {timeAgo(device.lastSeen)}
        </div>
      </div>
      {device.trusted && (
        <span className="shrink-0 text-[10px] px-2 py-1 rounded-full bg-emerald-400/15 text-emerald-300 hidden sm:inline-block">
          доверенное
        </span>
      )}
      {onRemove && (
        <button onClick={onRemove} aria-label="Удалить"
          className="shrink-0 text-white/30 hover:text-red-300 transition p-1">
          <Icon name="trash" size={14}/>
        </button>
      )}
    </div>
  );
}

function ShowMoreButton({ onClick, loading, label = 'Показать ещё 5' }) {
  return (
    <button onClick={onClick} disabled={loading}
      className="relative overflow-hidden w-full mt-2 py-3 rounded-2xl glass-soft text-xs font-medium text-white/70 hover:bg-white/8 transition flex items-center justify-center gap-2">
      {loading && <span className="load-bar"/>}
      <Icon name="chevron" size={12} className="rotate-90"/>
      <span className={loading ? 'opacity-70' : ''}>{loading ? 'Загрузка…' : label}</span>
    </button>
  );
}

/* ============================================================
   Screen: Onboarding
   ============================================================ */

function ScreenOnboarding({ fingerprint, onComplete }) {
  const [step, setStep] = useState(0);
  const [progress, setProgress] = useState(0);
  const [progressLabel, setProgressLabel] = useState('');
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);

  const createProfile = async () => {
    setError('');
    setLoading(true);
    setStep(1);
    setProgress(0);

    const steps = [
      { p: 15, label: 'Проверка устройства' },
      { p: 35, label: 'Генерация адреса' },
      { p: 55, label: 'Passkey (WebAuthn)' },
      { p: 75, label: 'Ключи шифрования' },
      { p: 100, label: 'Готово' },
    ];

    try {
      for (const s of steps) {
        await wait(400);
        setProgress(s.p);
        setProgressLabel(s.label);
      }

      const userId = await generateUniqueAddress();
      const passkey = await createPasskey({ id: userId });
      const authSecret = toHex(randomBytes(32));
      const cloudKey = toHex(randomBytes(32));

      run(
        `INSERT INTO users (id, created_at, trust_score, last_login, auth_secret, webauthn_id, fingerprint_id,
          luk_balance, mining_balance, transfer_limit, completed_deals, avg_response_sec, reputation, cloud_key)
         VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)`,
        [userId, Date.now(), 85, Date.now(), authSecret, passkey.id, fingerprint, 0, 0, 1000000, 0, 0, 5.0, cloudKey]
      );
      run(
        `INSERT INTO devices (id, user_id, name, location, added_at, last_seen, trusted, pubkey_hint)
         VALUES (?, ?, ?, ?, ?, ?, ?, ?)`,
        [fingerprint, userId, guessDeviceName(), 'Основное устройство', Date.now(), Date.now(), 1, passkey.id.slice(0, 16)]
      );

      try {
        await idbSet('recovery_hint_' + userId, {
          userId,
          authSecret,
          cloudKey,
          createdAt: Date.now(),
        });
      } catch {}

      await audit('onboarding', `addr=${userId.slice(0, 12)}`);
      await persistDB();

      await wait(400);
      const u = rowToUser(queryOne('SELECT * FROM users WHERE id = ?', [userId]));
      await createSession(u.id, fingerprint);
      setLoading(false);
      onComplete(u);
    } catch (e) {
      setLoading(false);
      setStep(0);
      setError(String(e).includes('passkey_failed')
        ? 'Не удалось создать passkey. Настрой биометрию на устройстве.'
        : 'Не удалось завершить настройку. Попробуй ещё раз.');
    }
  };

  return (
    <div className="fs-shell fs-center">
      <div className="fs-card fade-up">
        <div className="glass rounded-3xl p-7 sm:p-8 shadow-glow">
          <div className="flex items-center gap-3 mb-7 min-w-0">
            <Logo size={44}/>
            <div className="min-w-0">
              <div className="text-[11px] uppercase tracking-[0.18em] text-white/40">LUK COIN</div>
              <div className="text-[15px] font-semibold truncate">Создание кошелька</div>
            </div>
          </div>

          {step === 0 && (
            <div className="fade-up">
              <h1 className="text-[26px] sm:text-3xl font-semibold leading-tight tracking-tight mb-2">
                Создай кошелёк за 10 секунд
              </h1>
              <p className="text-white/55 text-sm mb-7 leading-relaxed">
                Ни пароля, ни имени. Только биометрия. После создания получишь файл восстановления .lukvault.
              </p>

              <div className="glass-soft rounded-2xl p-4 mb-5">
                <div className="flex items-center gap-3 min-w-0">
                  <div className="w-9 h-9 shrink-0 rounded-xl bg-indigo-400/15 flex items-center justify-center text-indigo-300">
                    <Icon name="fingerprint" size={16}/>
                  </div>
                  <div className="min-w-0 flex-1">
                    <div className="text-[11px] uppercase tracking-wider text-white/40">Отпечаток</div>
                    <div className="text-[12px] font-mono text-white/70 truncate">{fingerprint}</div>
                  </div>
                </div>
              </div>

              {error && <Alert>{error}</Alert>}

              <div className="mt-5">
                <Btn onClick={createProfile} loading={loading} disabled={loading}>
                  Создать кошелёк
                </Btn>
              </div>
            </div>
          )}

          {step === 1 && (
            <div className="fade-up">
              <h2 className="text-2xl font-semibold mb-2">Создаём кошелёк…</h2>
              <p className="text-white/55 text-sm mb-7">{progressLabel || 'Инициализация'}</p>

              <div className="h-2 w-full bg-white/8 rounded-full overflow-hidden mb-6">
                <div className="h-full bg-gradient-to-r from-indigo-400 via-violet-400 to-sky-400 transition-all duration-300"
                  style={{ width: progress + '%' }}/>
              </div>

              <ul className="space-y-3 text-sm">
                <Step done={progress >= 15} label="Отпечаток устройства"/>
                <Step done={progress >= 35} label="Уникальный адрес"/>
                <Step done={progress >= 55} label="Passkey (WebAuthn)"/>
                <Step done={progress >= 75} label="Ключи шифрования"/>
                <Step done={progress >= 100} label="Готово"/>
              </ul>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function Step({ done, label }) {
  return (
    <li className="flex items-center gap-3">
      <div className={`w-5 h-5 shrink-0 rounded-full flex items-center justify-center text-[10px] transition
        ${done ? 'bg-emerald-400/20 text-emerald-300' : 'bg-white/8 text-white/30'}`}>
        {done ? <Icon name="check" size={11}/> : '·'}
      </div>
      <span className={`truncate text-[13px] ${done ? 'text-white' : 'text-white/45'}`}>{label}</span>
    </li>
  );
}

/* ============================================================
   Screen: First Login (download vault)
   ============================================================ */

function ScreenFirstLogin({ user, onDone }) {
  const [downloaded, setDownloaded] = useState(false);
  const [downloading, setDownloading] = useState(false);
  const [error, setError] = useState('');

  const download = async () => {
    setError('');
    setDownloading(true);
    try {
      const blob = await createVaultFile(user);
      downloadBlob(blob, `lukvault-${user.id.replace('luk_', '').slice(0, 8)}.${VAULT_EXT}`);
      setDownloaded(true);
      await audit('vault_file_downloaded', user.id.slice(0, 12));
    } catch (e) {
      setError('Не удалось создать файл восстановления.');
    }
    setDownloading(false);
  };

  const finish = async () => {
    await persistDB();
    onDone();
  };

  return (
    <div className="fs-shell fs-center">
      <div className="fs-card fade-up">
        <div className="glass rounded-3xl p-7 sm:p-8 shadow-glow">
          <div className="flex items-center gap-3 mb-6 min-w-0">
            <Logo size={44}/>
            <div className="min-w-0">
              <div className="text-[11px] uppercase tracking-[0.18em] text-white/40">LUK COIN</div>
              <div className="text-[15px] font-semibold truncate">Файл восстановления</div>
            </div>
          </div>

          <div className="flex justify-center mb-5">
            <div className="relative">
              <div className="w-20 h-20 rounded-3xl bg-gradient-to-br from-indigo-500/30 to-sky-500/20 flex items-center justify-center text-white/85">
                <Icon name="file" size={36}/>
              </div>
              <div className="absolute inset-0 rounded-3xl pulse-ring pointer-events-none"/>
            </div>
          </div>

          <h2 className="text-2xl font-semibold mb-2 text-center">Сохрани файл доступа</h2>
          <p className="text-white/55 text-sm mb-6 leading-relaxed text-center">
            Внутри — зашифрованные ключи кошелька и ключ к облачной БД. Файл самодостаточен: работает даже при смене адреса сайта и на новом устройстве.
          </p>

          <div className="glass-soft rounded-2xl p-4 mb-5">
            <div className="text-[11px] uppercase tracking-wider text-white/40 mb-2">Адрес кошелька</div>
            <div className="font-mono text-[11px] text-white/80 break-all mb-3">{user.id}</div>
            <div className="text-[11px] uppercase tracking-wider text-white/40 mb-2">Имя файла</div>
            <div className="font-mono text-[12px] text-white/80 break-all">
              lukvault-{user.id.replace('luk_', '').slice(0, 8)}.{VAULT_EXT}
            </div>
          </div>

          {error && <Alert>{error}</Alert>}

          <div className="space-y-2.5">
            <Btn onClick={download} loading={downloading} disabled={downloading || downloaded}>
              {downloaded ? (
                <span className="flex items-center justify-center gap-2">
                  <Icon name="check" size={16}/> Файл скачан
                </span>
              ) : (
                <span className="flex items-center justify-center gap-2">
                  <Icon name="download" size={16}/> Скачать файл
                </span>
              )}
            </Btn>

            {downloaded && (
              <button onClick={finish}
                className="btn-ghost w-full py-3.5 rounded-2xl font-medium text-[15px] flex items-center justify-center gap-2">
                <Icon name="arrow" size={16}/> Перейти в кошелёк
              </button>
            )}

          <div className="mt-5 flex items-start gap-2.5 p-3.5 glass-soft rounded-2xl">
            <Icon name="shieldAlert" size={14} className="text-amber-300 mt-0.5 shrink-0"/>
            <div className="text-[11px] text-white/60 leading-relaxed">
              Храни файл в надёжном месте. Он понадобится для восстановления при смене устройства или очистке cookies.
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   Screen: Recovery from file
   ============================================================ */

function ScreenRecoveryFromFile({ onBack, onRestored }) {
  const [stage, setStage] = useState('upload');
  const [error, setError] = useState('');
  const [progress, setProgress] = useState(0);
  const [pendingUser, setPendingUser] = useState(null);
  const [pendingPayload, setPendingPayload] = useState(null);
  const [fingerprint, setFingerprint] = useState('');
  const [webauthnRotated, setWebauthnRotated] = useState(false);
  const [cloudSynced, setCloudSynced] = useState(false);
  const fileInputRef = useRef(null);

  useEffect(() => {
    (async () => setFingerprint(await getStableFingerprint()))();
  }, []);

  const handleFile = async (file) => {
    setError('');
    if (!file) return;

    try {
      const buffer = await file.arrayBuffer();
      const bytes = new Uint8Array(buffer);
      const result = await decryptVaultFile(bytes);
      const payload = result.payload;

      const u = {
        id: payload.user.id,
        createdAt: payload.user.created_at,
        trustScore: payload.user.trust_score,
        webauthnId: payload.user.webauthn_id,
        lukBalance: payload.user.luk_balance,
        miningBalance: payload.user.mining_balance || 0,
        transferLimit: payload.user.transfer_limit ?? 1000000,
        completedDeals: payload.user.completed_deals || 0,
        avgResponseSec: payload.user.avg_response_sec || 0,
        reputation: payload.user.reputation || 5.0,
      };

      setPendingUser(u);
      setPendingPayload(payload);
      setStage('confirm');
      setProgress(20);
    } catch (e) {
      const msg = String(e?.message || e);
      if (msg === 'no_key') {
        setError('Не удалось расшифровать файл. Проверь, что это тот самый .lukvault и он не повреждён.');
      } else if (msg === 'bad_magic') {
        setError('Это не файл .lukvault.');
      } else if (msg === 'bad_version') {
        setError('Версия файла не поддерживается. Обнови приложение.');
      } else if (msg === 'short_file') {
        setError('Файл повреждён или слишком короткий.');
      } else {
        setError('Не удалось прочитать файл восстановления.');
      }
    }
  };

  const confirmRecovery = async () => {
    setError('');
    if (!pendingUser || !pendingPayload) return;

    setStage('verifying');
    setProgress(40);
    await wait(300);
    setProgress(60);

    // Пробуем подтвердить биометрией. Если origin сменился — verifyBiometric
    // бросает NotAllowed. Тогда мы перевыпускаем passkey в restoreFromPayload.
    let bioOk = false;
    try {
      bioOk = await verifyBiometric(pendingUser.webauthnId);
    } catch {
      bioOk = false;
    }

    // Если биометрия не подтверждена из-за смены origin — не блокируем,
    // но требуем хотя бы успешную дешифровку файла.
    if (!bioOk) {
      // Пробуем создать новый passkey прямо сейчас — это подтвердит владение устройством
      try {
        await createPasskey({ id: pendingUser.id });
      } catch {
        setStage('confirm');
        setProgress(0);
        setError('Биометрия недоступна. Убедись, что на устройстве настроен Face ID / отпечаток.');
        return;
      }
    }

    setProgress(80);
    await wait(200);

    const fp = fingerprint || await getStableFingerprint();

    try {
      const restored = await restoreFromPayload(pendingPayload, fp);
      setWebauthnRotated(!!restored.webauthnRotated);

      // Пробуем синхронизироваться с облаком, если задан CLOUD_ENDPOINT
      if (CLOUD_ENDPOINT && pendingPayload.cloud_key) {
        try {
          const exported = db.export();
          const { ciphertext, iv } = await aesEncryptBytes(exported, pendingPayload.cloud_key);
          const res = await cloudUpsertAccount(restored.user.id, {
            iv, data: Array.from(ciphertext), ts: Date.now(),
          });
          if (res.ok) setCloudSynced(true);
        } catch {}
      }

      await audit('recovery_from_file', restored.user.id.slice(0, 12));
      setProgress(100);
      await wait(400);
      setStage('done');
      await wait(700);
      onRestored(restored.user);
    } catch (e) {
      setStage('confirm');
      setProgress(0);
      setError('Не удалось записать данные. Попробуй ещё раз.');
    }
  };

  return (
    <div className="fs-shell fs-center">
      <div className="fs-card fade-up" style={{ maxWidth: '32rem' }}>
        <div className="glass rounded-3xl p-7 sm:p-8 shadow-glow">
          <button onClick={onBack} className="mb-6 flex items-center gap-2 text-xs text-white/45 hover:text-white/80 transition">
            <Icon name="back" size={14}/> Назад
          </button>

          {stage === 'upload' && (<>
            <div className="flex items-center gap-3 mb-5 min-w-0">
              <div className="w-11 h-11 shrink-0 rounded-2xl bg-indigo-400/15 flex items-center justify-center text-indigo-300">
                <Icon name="upload" size={20}/>
              </div>
              <div className="min-w-0">
                <div className="text-[11px] uppercase tracking-[0.16em] text-white/40">Восстановление</div>
                <div className="text-[15px] font-semibold truncate">Загрузи файл .lukvault</div>
              </div>
            </div>

            <h2 className="text-2xl font-semibold mb-2">Восстанови кошелёк</h2>
            <p className="text-white/55 text-sm mb-6 leading-relaxed">
              Файл содержит зашифрованную копию всего кошелька и ключ к облачной БД. Работает даже при смене адреса сайта — биометрический ключ перевыпустится автоматически.
            </p>

            <input
              ref={fileInputRef}
              type="file"
              accept={`.${VAULT_EXT},application/octet-stream`}
              className="hidden"
              onChange={(e) => {
                const f = e.target.files?.[0];
                if (f) handleFile(f);
                e.target.value = '';
              }}
            />

            <button onClick={() => fileInputRef.current?.click()}
              className="w-full glass-soft rounded-2xl p-6 border-dashed border-2 border-white/15 hover:border-white/25 transition flex flex-col items-center gap-3">
              <div className="w-14 h-14 rounded-2xl bg-white/5 flex items-center justify-center text-white/60">
                <Icon name="file" size={24}/>
              </div>
              <div className="text-sm font-medium">Выбрать файл</div>
              <div className="text-[11px] text-white/45">Формат .{VAULT_EXT}</div>
            </button>

            {error && <Alert>{error}</Alert>}

            <div className="mt-5 flex items-start gap-2.5 p-3.5 glass-soft rounded-2xl">
              <Icon name="info" size={14} className="text-indigo-300 mt-0.5 shrink-0"/>
              <div className="text-[11px] text-white/60 leading-relaxed">
                Расшифровка произойдёт только после подтверждения биометрией. Данные никогда не покидают устройство.
              </div>
            </div>
          </>)}

          {stage === 'confirm' && pendingUser && (<>
            <div className="flex items-center gap-3 mb-5 min-w-0">
              <div className="w-11 h-11 shrink-0 rounded-2xl bg-emerald-400/15 flex items-center justify-center text-emerald-300">
                <Icon name="check" size={20}/>
              </div>
              <div className="min-w-0">
                <div className="text-[11px] uppercase tracking-[0.16em] text-white/40">Файл действителен</div>
                <div className="text-[15px] font-semibold truncate">Подтверди биометрию</div>
              </div>
            </div>

            <div className="glass-soft rounded-2xl p-4 mb-4">
              <div className="text-[11px] uppercase tracking-wider text-white/40 mb-2">Аккаунт</div>
              <div className="flex items-center gap-3 min-w-0">
                <div className="w-10 h-10 shrink-0 rounded-xl bg-gradient-to-br from-amber-400/30 to-orange-500/20 flex items-center justify-center">
                  <Icon name="key" size={18}/>
                </div>
                <div className="min-w-0">
                  <div className="text-sm font-mono truncate">{shortAddress(pendingUser.id)}</div>
                  <div className="text-[11px] text-white/45">Создан {timeAgo(pendingUser.createdAt)}</div>
                </div>
              </div>
            </div>

            <div className="glass-soft rounded-2xl p-4 mb-4">
              <div className="text-[11px] uppercase tracking-wider text-white/40 mb-2">В файле</div>
              <div className="grid grid-cols-3 gap-2 text-center">
                <div>
                  <div className="text-base font-semibold">{formatLuk(pendingUser.lukBalance)}</div>
                  <div className="text-[10px] uppercase text-white/40 mt-0.5">LUK</div>
                </div>
                <div>
                  <div className="text-base font-semibold">{(pendingPayload.transactions || []).length}</div>
                  <div className="text-[10px] uppercase text-white/40 mt-0.5">Операций</div>
                </div>
                <div>
                  <div className="text-base font-semibold">{(pendingPayload.devices || []).length}</div>
                  <div className="text-[10px] uppercase text-white/40 mt-0.5">Устройств</div>
                </div>
              </div>
            </div>

            {error && <Alert>{error}</Alert>}

            <div className="mt-5">
              <Btn onClick={confirmRecovery}>Подтвердить биометрией</Btn>
            </div>
          </>)}

          {stage === 'verifying' && (
            <div className="py-6 text-center fade-up">
              <div className="flex justify-center mb-6">
                <div className="w-20 h-20 rounded-full bg-gradient-to-br from-indigo-500/30 to-sky-500/30 flex items-center justify-center">
                  <Icon name="shieldcheck" size={34}/>
                </div>
              </div>
              <h2 className="text-2xl font-semibold mb-2">Проверяем личность</h2>
              <p className="text-white/55 text-sm mb-6">Криптографическое подтверждение</p>
              <div className="h-2 w-full bg-white/8 rounded-full overflow-hidden max-w-xs mx-auto">
                <div className="h-full bg-gradient-to-r from-indigo-400 to-sky-400 transition-all duration-300"
                  style={{ width: progress + '%' }}/>
              </div>
            </div>
          )}

          {stage === 'done' && (
            <div className="py-10 text-center fade-up">
              <div className="flex justify-center mb-5">
                <div className="w-20 h-20 rounded-full bg-emerald-400/15 flex items-center justify-center text-emerald-300">
                  <Icon name="check" size={34}/>
                </div>
              </div>
              <h2 className="text-2xl font-semibold mb-2">Кошелёк восстановлен</h2>
              {webauthnRotated && (
                <p className="text-amber-200 text-[12px] mt-1">Биометрический ключ перевыпущен для нового адреса сайта</p>
              )}
              {cloudSynced && (
                <p className="text-emerald-300 text-[12px] mt-1">Синхронизировано с облачной БД</p>
              )}
              <p className="text-white/55 text-sm mt-2">Открываем кошелёк…</p>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   Screen: Login
   ============================================================ */

function ScreenLogin({ user, onLogin }) {
  const [stage, setStage] = useState('detect');
  const [error, setError] = useState('');
  const startedRef = useRef(false);

  const startFlow = useCallback(async () => {
    setError('');
    setStage('detect');
    await wait(600);
    setStage('touch');
    try {
      const ok = await verifyBiometric(user?.webauthnId);
      if (!ok) { setError('Биометрия не подтверждена.'); setStage('error'); return; }
      setStage('done');
      await wait(400);
      onLogin();
    } catch (e) {
      const msg = String(e || '');
      if (msg.includes('NotAllowed') || msg.includes('NotSupported') || msg.includes('SecurityError')) {
        // Origin изменился — перевыпускаем ключ автоматически
        try {
          await createPasskey({ id: user.id });
          setError('Ключ доступа перевыпущен для нового адреса сайта. Подтверди биометрией ещё раз.');
          setStage('error');
          // Дадим возможность сразу попробовать
          setTimeout(() => startFlow(), 800);
          return;
        } catch {}
      }
      setError('Не удалось подтвердить биометрию.');
      setStage('error');
    }
  }, [user?.webauthnId, user?.id, onLogin]);

  useEffect(() => {
    if (startedRef.current) return;
    startedRef.current = true;
    startFlow();
  }, [startFlow]);

  return (
    <div className="fs-shell fs-center">
      <div className="fs-card fade-up">
        <div className="glass rounded-3xl p-7 sm:p-8 shadow-glow text-center">
          <div className="flex justify-center mb-6">
            <div className="relative">
              <div className="w-24 h-24 rounded-full bg-gradient-to-br from-amber-400/30 to-orange-500/20 flex items-center justify-center text-white/85">
                <Icon name="face" size={44}/>
              </div>
              {stage === 'touch' && <div className="absolute inset-0 rounded-full pulse-ring"/>}
            </div>
          </div>

          {stage === 'detect' && (<>
            <h2 className="text-2xl font-semibold mb-2">С возвращением</h2>
            <p className="text-white/55 text-sm">Проверяем устройство</p>
          </>)}
          {stage === 'touch' && (<>
            <h2 className="text-2xl font-semibold mb-2">Подтверди биометрией</h2>
            <p className="text-white/55 text-sm">Face ID / отпечаток</p>
          </>)}
          {stage === 'done' && (<>
            <h2 className="text-2xl font-semibold mb-2">Готово</h2>
            <p className="text-white/55 text-sm">Открываем кошелёк…</p>
          </>)}
          {stage === 'error' && (<>
            <h2 className="text-2xl font-semibold mb-2">Не удалось войти</h2>
            <p className="text-white/55 text-sm">Попробуй ещё раз</p>
          </>)}

          {error && <Alert kind="warn">{error}</Alert>}

          <div className="mt-7 pt-6 border-t border-white/10 text-left">
            <div className="text-[11px] uppercase tracking-[0.16em] text-white/40 mb-3">Профиль</div>
            <div className="glass-soft rounded-2xl p-3">
              <div className="flex items-center gap-3 min-w-0">
                <div className="w-9 h-9 shrink-0 rounded-xl bg-gradient-to-br from-amber-400/30 to-orange-500/20 flex items-center justify-center">
                  <Icon name="key" size={16}/>
                </div>
                <div className="min-w-0">
                  <div className="text-sm font-mono truncate">{shortAddress(user?.id || '')}</div>
                  <div className="text-[11px] text-white/45">Создан {timeAgo(user?.createdAt || Date.now())}</div>
                </div>
              </div>
            </div>
          </div>

          {stage === 'error' && (
            <div className="mt-5">
              <Btn onClick={startFlow} variant="ghost">Попробовать снова</Btn>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   Screen: Main App
   ============================================================ */

function ScreenApp({ user, onLogout, refreshUser }) {
  const [tab, setTab] = useState('home');
  const [tabLoading, setTabLoading] = useState(false);
  const [balance, setBalance] = useState(user.lukBalance || 0);
  const [txs, setTxs] = useState([]);
  const [devices, setDevices] = useState([]);
  const [currentFp, setCurrentFp] = useState('');

  const [showProfile, setShowProfile] = useState(false);
  const [selectedTx, setSelectedTx] = useState(null);
  const [downloadingVault, setDownloadingVault] = useState(false);
  const [vaultError, setVaultError] = useState('');
  const [vaultOk, setVaultOk] = useState(false);
  const [cloudState, setCloudState] = useState('idle'); // idle | syncing | ok | err

  const refresh = useCallback(async () => {
    const u = rowToUser(queryOne('SELECT * FROM users WHERE id = ?', [user.id]));
    if (u) setBalance(u.lukBalance);
    const txRows = queryAll('SELECT * FROM transactions WHERE user_id = ? ORDER BY ts DESC LIMIT 300', [user.id]);
    setTxs(txRows
      .filter(r => !(r.amount === 0 && ['p2p_commission_waived', 'send_fee'].includes(r.kind)))
      .map(r => ({
        id: r.id, kind: r.kind, amount: r.amount,
        counterparty: r.counterparty, note: r.note, ts: r.ts,
      }))
    );
    const devRows = queryAll('SELECT * FROM devices WHERE user_id = ? ORDER BY last_seen DESC', [user.id]).map(rowToDevice);
    setDevices(devRows);
    setCurrentFp(await getStableFingerprint());
  }, [user.id]);

  useEffect(() => { refresh(); }, [refresh]);

  const switchTab = (k) => {
    if (k === tab) return;
    setTabLoading(true);
    setTab(k);
    setTimeout(() => setTabLoading(false), 260);
  };

  const removeDevice = async (id) => {
    run('DELETE FROM devices WHERE id = ? AND user_id = ?', [id, user.id]);
    await audit('device_removed', id.slice(0, 10));
    await persistDB();
    refresh();
  };

  const copy = async (text) => {
    try { await navigator.clipboard.writeText(text); } catch {}
  };

  const downloadVault = async () => {
    setVaultError('');
    setVaultOk(false);
    setDownloadingVault(true);
    try {
      const blob = await createVaultFile(user);
      downloadBlob(blob, `lukvault-${user.id.replace('luk_', '').slice(0, 8)}.${VAULT_EXT}`);
      setVaultOk(true);
      await audit('vault_file_downloaded', user.id.slice(0, 12));
      setTimeout(() => setVaultOk(false), 3000);
    } catch (e) {
      setVaultError('Не удалось создать файл.');
    }
    setDownloadingVault(false);
  };

  const syncCloud = async () => {
    if (!CLOUD_ENDPOINT) return;
    setCloudState('syncing');
    try {
      const uRow = queryOne('SELECT cloud_key FROM users WHERE id = ?', [user.id]);
      const key = uRow?.cloud_key;
      if (!key) { setCloudState('err'); return; }
      const exported = db.export();
      const { ciphertext, iv } = await aesEncryptBytes(exported, key);
      const res = await cloudUpsertAccount(user.id, { iv, data: Array.from(ciphertext), ts: Date.now() });
      setCloudState(res.ok ? 'ok' : 'err');
    } catch {
      setCloudState('err');
    }
    setTimeout(() => setCloudState('idle'), 3000);
  };

  return (
    <div className="fs-shell">
      <div className="w-full max-w-2xl lg:max-w-4xl mx-auto px-4 sm:px-5 lg:px-6 py-5 sm:py-6 flex flex-col">
        <div className="flex items-center justify-between gap-3 mb-5 min-w-0">
          <div className="flex items-center gap-3 min-w-0">
            <Logo size={40}/>
            <div className="min-w-0">
              <div className="text-[11px] uppercase tracking-[0.16em] text-white/40">LUK COIN</div>
              <div className="text-[15px] font-semibold truncate font-mono">{shortAddress(user.id)}</div>
            </div>
          </div>
          <button onClick={() => setShowProfile(true)}
            className="shrink-0 p-2.5 rounded-xl glass-soft text-white/60 hover:text-white transition">
            <Icon name="user" size={16}/>
          </button>
        </div>

        <div className="glass-soft rounded-2xl p-1 mb-5 grid grid-cols-4 gap-1 relative">
          {tabLoading && <div className="load-bar absolute left-0 right-0 top-0"/>}
          {[
            { k: 'home', label: 'Кошелёк', icon: 'wallet' },
            { k: 'p2p', label: 'P2P', icon: 'shop' },
            { k: 'mining', label: 'Майнинг', icon: 'pickaxe' },

            <HomeTab user={user} balance={balance} onCopy={copy} refreshUser={refreshUser} refresh={refresh}/>
          )}

                <div key={i} className="flex justify-between items-start py-1 gap-3">

                  <span className={`font-bold text-sm text-right break-all ${row.mono ? 'font-mono' : ''}`}>
                    {row.value}
                  </span>
                </div>
              ))}
            </div>
          )}
        </BottomSheet>

        <BottomSheet isOpen={showProfile} onClose={() => setShowProfile(false)} title="Профиль">
          <div className="space-y-4">
            <div className="glass-soft rounded-2xl p-4">
              <div className="text-[11px] uppercase tracking-wider text-white/40 mb-2">Адрес кошелька</div>
              <div className="flex items-center gap-2 min-w-0">
                <div className="flex-1 font-mono text-[12px] truncate">{user.id}</div>
                <button onClick={() => copy(user.id)}
                  className="shrink-0 p-2 rounded-xl bg-white/5 text-white/60 hover:text-white transition">
                  <Icon name="copy" size={14}/>
                </button>
              </div>
            </div>

            <div className="glass-soft rounded-2xl p-4">
              <div className="text-[11px] uppercase tracking-wider text-white/40 mb-2">Баланс</div>
              <div className="text-2xl font-bold">{formatLuk(balance)} <span className="text-amber-300 text-lg">LUK</span></div>
            </div>

            <div className="glass-soft rounded-2xl p-4">
              <div className="text-[11px] uppercase tracking-wider text-white/40 mb-2">Лимит на переводы и продажу</div>
              <div className="text-lg font-bold">{formatLuk(user.transferLimit ?? 1000000)} <span className="text-amber-300 text-sm">LUK</span></div>
            </div>

            <div className="glass-soft rounded-2xl p-4">
              <div className="text-[11px] uppercase tracking-wider text-white/40 mb-2">Файл восстановления</div>
              <div className="text-[12px] text-white/60 leading-relaxed mb-3">
                Скачай зашифрованный файл .lukvault. Внутри всё: баланс, история, устройства, ключ к облачной БД.
              </div>
              <Btn onClick={downloadVault} loading={downloadingVault} disabled={downloadingVault} variant="ghost">
                <span className="flex items-center justify-center gap-2">
                  <Icon name={vaultOk ? 'check' : 'download'} size={16}/>
                  {vaultOk ? 'Файл скачан' : 'Скачать файл .lukvault'}
                </span>
              </Btn>
              {vaultError && <Alert>{vaultError}</Alert>}
            </div>

            <div className="glass-soft rounded-2xl p-4">
              <div className="text-[11px] uppercase tracking-wider text-white/40 mb-2">Облачная БД (Cloudflare D1)</div>
              <div className="text-[12px] text-white/60 leading-relaxed mb-3">
                {CLOUD_ENDPOINT
                  ? 'Синхронизация с Cloudflare Worker + D1. Данные шифруются ключом из файла восстановления.'
                  : 'Облачная БД не подключена. Задайте CLOUD_ENDPOINT в коде, чтобы включить.'}
              </div>
              <button onClick={syncCloud} disabled={!CLOUD_ENDPOINT || cloudState === 'syncing'}
                className="btn-ghost w-full py-3 rounded-2xl text-xs font-medium disabled:opacity-40 flex items-center justify-center gap-2">

                  : cloudState === 'ok' ? 'Синхронизировано'

            <div className="glass-soft rounded-2xl p-4">
              <div className="text-[11px] uppercase tracking-wider text-white/40 mb-2">Репутация</div>

                      onRemove={d.id !== currentFp && devices.length > 1 ? () => removeDevice(d.id) : null}/>

                      <span className="absolute -top-1 left-3 text-[9px] uppercase tracking-wider px-1.5 py-0.5 rounded-full bg-indigo-400/20 text-indigo-200">
