         `P2P покупка (авто) · ${formatMoney(deal.rub_amount)}`, now]);

      run('INSERT INTO transactions (id, user_id, kind, amount, counterparty, note, ts) VALUES (?, ?, ?, ?, ?, ?, ?)',
        [uuid(), deal.seller_id, 'p2p_commission', -commissionLuk, 'LUK Protocol',
         `Комиссия 5% · ${formatMoney(commission)}`, now]);
      run('INSERT INTO transactions (id, user_id, kind, amount, counterparty, note, ts) VALUES (?, ?, ?, ?, ?, ?, ?)',
        [uuid(), deal.seller_id, 'p2p_seller_auto', 0, 'LUK Protocol',
         'Заявка исполнена автоматически по таймауту', now]);

      run('UPDATE users SET reputation = MAX(1.0, reputation - 0.3) WHERE id = ?', [deal.seller_id]);
    });
    persistDB().then(() => { loadAll(); refresh(); });
  }, [loadAll, refresh]);

  useEffect(() => {
    const t = setInterval(() => {
      setTick(v => v + 1);
      autoExecuteExpired();
    }, 1000);
    return () => clearInterval(t);
  }, [autoExecuteExpired]);

  const createOrder = async () => {
    setFormError('');
    const lukAmt = parseFloat(String(formLuk).replace(',', '.'));
    const rubAmt = parseFloat(String(formRub).replace(',', '.'));
    if (!lukAmt || lukAmt <= 0) { setFormError('Укажи количество LUK.'); return; }
    if (!rubAmt || rubAmt <= 0) { setFormError('Укажи сумму в рублях.'); return; }
    if (!formBank.trim()) { setFormError('Укажи название банка.'); return; }
    if (!formPhone.trim() || formPhone.replace(/\D/g, '').length < 11) { setFormError('Укажи корректный номер телефона.'); return; }

    const existing = queryOne('SELECT id FROM p2p_orders WHERE seller_id = ? AND status = ?', [user.id, 'active']);
    if (existing) { setFormError('У тебя уже есть активная заявка. Отмени её, чтобы создать новую.'); return; }
    if (lukAmt > balance) { setFormError('Недостаточно LUK на балансе.'); return; }

    const limit = user.transferLimit ?? 1000000;
    if (lukAmt > limit) { setFormError(`Превышен общий лимит. Доступно: ${formatLuk(limit)} LUK.`); return; }

    setFormLoading(true);
    await wait(500);

    const rate = rubAmt / lukAmt;

    run(
      `INSERT INTO p2p_orders (id, seller_id, luk_amount, luk_original, rub_amount, rub_original, rate, bank, phone, status, created_at)
       VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)`,
      [uuid(), user.id, lukAmt, lukAmt, rubAmt, rubAmt, rate, sanitize(formBank, 60), sanitize(formPhone, 20), 'active', Date.now()]
    );

    run('UPDATE users SET luk_balance = luk_balance - ?, transfer_limit = transfer_limit - ? WHERE id = ?',
      [lukAmt, lukAmt, user.id]);
    run('INSERT INTO transactions (id, user_id, kind, amount, counterparty, note, ts) VALUES (?, ?, ?, ?, ?, ?, ?)',
      [uuid(), user.id, 'p2p_sell', -lukAmt, 'P2P Frozen', 'Средства заморожены под заявку', Date.now()]);
    await audit('p2p_order_created', `luk=${lukAmt} rub=${rubAmt}`);
    await persistDB();

    setFormLoading(false);
    setFormLuk(''); setFormRub(''); setFormBank(''); setFormPhone('');
    await loadAll(); await refresh(); await refreshUser?.();
    setSub('my-orders');
  };

  const cancelOrder = async (orderId) => {
    const order = queryOne('SELECT * FROM p2p_orders WHERE id = ?', [orderId]);
    if (!order) return;
    if (order.locked_by) return;
    run('UPDATE users SET luk_balance = luk_balance + ?, transfer_limit = transfer_limit + ? WHERE id = ?',
      [order.luk_amount, order.luk_amount, user.id]);
    run('UPDATE p2p_orders SET status = ? WHERE id = ?', ['cancelled', orderId]);
    run('INSERT INTO transactions (id, user_id, kind, amount, counterparty, note, ts) VALUES (?, ?, ?, ?, ?, ?, ?)',
      [uuid(), user.id, 'p2p_refund', order.luk_amount, 'P2P Refund', 'Отмена заявки', Date.now()]);
    await audit('p2p_order_cancelled', orderId.slice(0, 8));
    await persistDB();
    await loadAll(); await refresh(); await refreshUser?.();
  };

  const openBuy = (order) => {
    if (order.seller_id === user.id) return;
    const live = queryOne('SELECT * FROM p2p_orders WHERE id = ?', [order.id]);
    if (live.locked_by && live.locked_by !== user.id) return;
    if (live.locked_by === user.id) {
      const deal = queryOne(`SELECT * FROM p2p_deals WHERE order_id = ? AND buyer_id = ? AND status = 'pending' ORDER BY created_at DESC LIMIT 1`,
        [order.id, user.id]);
      if (deal) {
        setBuyOrder(live);
        setWaitingDeal(deal);
        setBuyStage('waiting');
        return;
      }
    }
    setBuyOrder(order);
    setBuyLukAmount('');
    setBuyRubAmount('');
    setBuyStage('amount');
    setBuyOpId('');
    setBuyError('');
  };

  const calcRub = (lukAmt) => {
    if (!buyOrder || !lukAmt) return 0;
    return lukAmt * buyOrder.rate;
  };

  const submitBuy = async () => {
    setBuyError('');
    const lukAmt = parseFloat(String(buyLukAmount).replace(',', '.'));
    if (!lukAmt || lukAmt <= 0) { setBuyError('Укажи количество LUK.'); return; }
    if (lukAmt > buyOrder.luk_amount) { setBuyError('В заявке нет столько LUK.'); return; }
    if (buyOrder.seller_id === user.id) { setBuyError('Нельзя покупать у себя.'); return; }

    setBuyLoading(true);
    await wait(300);

    const live = queryOne('SELECT * FROM p2p_orders WHERE id = ?', [buyOrder.id]);
    if (!live || live.status !== 'active') {
      setBuyLoading(false);
      setBuyError('Заявка больше недоступна.');
      return;
    }
    if (live.locked_by && live.locked_by !== user.id) {
      setBuyLoading(false);
      setBuyError('Эту заявку уже взял другой покупатель.');
      return;
    }
    if (!live.locked_by) {
      run('UPDATE p2p_orders SET locked_by = ?, locked_at = ? WHERE id = ? AND locked_by IS NULL',
        [user.id, Date.now(), buyOrder.id]);
      await persistDB();
      const check = queryOne('SELECT locked_by FROM p2p_orders WHERE id = ?', [buyOrder.id]);
      if (check?.locked_by !== user.id) {
        setBuyLoading(false);
        setBuyError('Не удалось закрепить заявку. Попробуй снова.');
        return;
      }
    }

    const rubAmt = lukAmt * buyOrder.rate;
    setBuyRubAmount(rubAmt.toFixed(2));
    setBuyLoading(false);
    setBuyStage('payment');
    await loadAll();
  };

  const submitBuyerOpId = async () => {
    setBuyError('');
    const normalized = normalizeOperationId(buyOpId);
    if (!isValidOperationId(normalized)) {
      setBuyError('ID операции должен быть в формате: заглавные буквы и цифры, минимум 15 символов. Пример: A6227022310219040G10070011830701');
      return;
    }

    setBuyLoading(true);
    await wait(400);

    const lukAmt = parseFloat(String(buyLukAmount).replace(',', '.'));
    const rubAmt = lukAmt * buyOrder.rate;

    const dealId = uuid();
    const deadlineAt = Date.now() + 15 * 60 * 1000;

    run(
      `INSERT INTO p2p_deals (id, order_id, seller_id, buyer_id, luk_amount, rub_amount, commission,
        seller_bank, seller_phone, buyer_op_id, status, created_at, updated_at, deadline_at)
       VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)`,
      [dealId, buyOrder.id, buyOrder.seller_id, user.id, lukAmt, rubAmt, 0,
        buyOrder.bank, buyOrder.phone, normalized, 'pending', Date.now(), Date.now(), deadlineAt]
    );

    const newLukLeft = buyOrder.luk_amount - lukAmt;
    const newRubLeft = buyOrder.rub_amount - rubAmt;
    if (newLukLeft <= 0.0001) {
      run('UPDATE p2p_orders SET luk_amount = ?, rub_amount = ?, status = ?, locked_by = NULL, locked_at = NULL WHERE id = ?',
        [0, 0, 'filled', buyOrder.id]);
    } else {
      run('UPDATE p2p_orders SET luk_amount = ?, rub_amount = ? WHERE id = ?',
        [newLukLeft, newRubLeft, buyOrder.id]);
    }

    await audit('p2p_deal_buyer_created', dealId.slice(0, 8));
    await persistDB();

    const deal = queryOne('SELECT * FROM p2p_deals WHERE id = ?', [dealId]);
    setWaitingDeal(deal);
    setBuyLoading(false);
    setBuyStage('waiting');
    await loadAll();
  };

  const submitSellerOpId = async () => {
    setSellerError('');
    const normalized = normalizeOperationId(sellerOpId);
    if (!isValidOperationId(normalized)) {
      setSellerError('ID операции должен быть в формате: заглавные буквы и цифры, минимум 15 символов.');
      return;
    }
    if (!sellerDeal) return;

    const deal = sellerDeal;
    const expected = normalizeOperationId(deal.buyer_op_id || '');
    if (!expected || expected !== normalized) {
      setSellerError('ID операции не совпадает с ID покупателя. Сделка не может быть исполнена.');
      return;
    }

    setSellerLoading(true);
    await wait(400);

    const commission = deal.rub_amount * 0.05;
    const commissionLuk = deal.luk_amount * 0.05;
    const responseSec = Math.round((Date.now() - deal.created_at) / 1000);

    const isFast = responseSec <= 120;
    const isQuality = responseSec <= 300;
    const finalCommission = isFast ? 0 : commission;
    const finalCommissionLuk = isFast ? 0 : commissionLuk;

    let limitBonus = 0;
    if (isFast) limitBonus = Math.round(deal.luk_amount * 5);
    else if (isQuality) limitBonus = Math.round(deal.luk_amount * 2);

    run(
      `UPDATE p2p_deals SET seller_op_id = ?, status = ?, commission = ?, seller_response_sec = ?, updated_at = ? WHERE id = ?`,
      [normalized, 'completed', finalCommission, responseSec, Date.now(), deal.id]
    );

    run('UPDATE users SET luk_balance = luk_balance + ? WHERE id = ?', [deal.luk_amount, deal.buyer_id]);
    run('INSERT INTO transactions (id, user_id, kind, amount, counterparty, note, ts) VALUES (?, ?, ?, ?, ?, ?, ?)',
      [uuid(), deal.buyer_id, 'p2p_buy', deal.luk_amount, deal.seller_id, `P2P покупка · ${formatMoney(deal.rub_amount)}`, Date.now()]);

    if (!isFast) {
      run('INSERT INTO transactions (id, user_id, kind, amount, counterparty, note, ts) VALUES (?, ?, ?, ?, ?, ?, ?)',
        [uuid(), deal.seller_id, 'p2p_commission', -finalCommissionLuk, 'LUK Protocol',
         `Комиссия 5% · ${formatMoney(finalCommission)}`, Date.now()]);
    }

    if (limitBonus > 0) {
      run('UPDATE users SET transfer_limit = transfer_limit + ? WHERE id = ?', [limitBonus, deal.seller_id]);
      run('INSERT INTO transactions (id, user_id, kind, amount, counterparty, note, ts) VALUES (?, ?, ?, ?, ?, ?, ?)',
        [uuid(), deal.seller_id, 'p2p_limit_bonus', limitBonus, 'LUK Protocol',
         `Бонус к лимиту за ${responseSec}с`, Date.now()]);
    }

    const seller = queryOne('SELECT * FROM users WHERE id = ?', [deal.seller_id]);
    if (seller) {
      const prevDeals = seller.completed_deals || 0;
      const prevAvg = seller.avg_response_sec || 0;
      const newDeals = prevDeals + 1;
      const newAvg = Math.round((prevAvg * prevDeals + responseSec) / newDeals);
      let repDelta = 0;
      if (responseSec <= 60) repDelta = +0.2;
      else if (responseSec <= 300) repDelta = +0.1;
      else if (responseSec <= 600) repDelta = 0;
      else repDelta = -0.1;
      const newRep = Math.min(5.0, Math.max(1.0, (seller.reputation || 5.0) + repDelta));
      run('UPDATE users SET completed_deals = ?, avg_response_sec = ?, reputation = ?, trust_score = MIN(100, trust_score + 1) WHERE id = ?',
        [newDeals, newAvg, newRep, deal.seller_id]);
    }

    const order = queryOne('SELECT * FROM p2p_orders WHERE id = ?', [deal.order_id]);
    if (order && order.status === 'active') {
      run('UPDATE p2p_orders SET locked_by = NULL, locked_at = NULL WHERE id = ?', [order.id]);
    }

    await audit('p2p_deal_completed', deal.id.slice(0, 8));
    await persistDB();
    setSellerLoading(false);
    setSellerDeal(null);
    setSellerOpId('');
    await loadAll(); await refresh(); await refreshUser?.();
  };

  const marketStats = useMemo(() => {
    let rate = 0;

    const active = orders.filter(o => o.status === 'active');
    if (active.length) {
      const rates = active.map(o => o.rate).filter(r => isFinite(r) && r > 0);
      if (rates.length) rate = rates.reduce((a, b) => a + b, 0) / rates.length;
    }

    const hourAgo = Date.now() - 60 * 60 * 1000;
    const recent = active.filter(o => o.created_at >= hourAgo);
    const hourlyVolume = recent.reduce((a, o) => a + (o.luk_original || o.luk_amount || 0), 0);

    const balancesRow = queryOne('SELECT COALESCE(SUM(luk_balance), 0) as total FROM users');
    const balances = balancesRow?.total || 0;
    const frozenRow = queryOne(`SELECT COALESCE(SUM(luk_amount), 0) as total FROM p2p_orders WHERE status = 'active'`);
    const frozen = frozenRow?.total || 0;
    const totalSupply = balances + frozen;
    const marketCap = rate * totalSupply;

    return { rate, hourlyVolume, marketCap, totalSupply, balances, frozen, hasData: active.length > 0 };
  }, [orders]);

  useEffect(() => {
    if (!marketStats.hasData || marketStats.rate <= 0) return;
    const now = Date.now();
    const last = queryOne('SELECT ts, rate FROM price_history ORDER BY ts DESC LIMIT 1');
    if (!last || now - last.ts >= 60000 || Math.abs(last.rate - marketStats.rate) > 0.001) {
      run('INSERT INTO price_history (ts, rate, volume) VALUES (?, ?, ?)',
        [now, marketStats.rate, marketStats.hourlyVolume]);
      persistDB().then(() => {
        const ph = queryAll('SELECT ts, rate, volume FROM price_history ORDER BY ts ASC LIMIT 500');
        setPricePoints(ph);
      });
    }
  }, [marketStats.rate, marketStats.hourlyVolume, marketStats.hasData]);

  const marketOrders = useMemo(() => orders, [orders]);
  const visibleOrders = useMemo(() => marketOrders.slice(0, ordersVisible), [marketOrders, ordersVisible]);
  const visibleMyOrders = useMemo(() => myOrders.slice(0, myOrdersVisible), [myOrders, myOrdersVisible]);
  const visibleDeals = useMemo(() => myDeals.slice(0, dealsVisible), [myDeals, dealsVisible]);

  const hasMoreOrders = ordersVisible < marketOrders.length;
  const hasMoreMyOrders = myOrdersVisible < myOrders.length;
  const hasMoreDeals = dealsVisible < myDeals.length;

  const showMoreOrders = () => {
    setOrdersLoading(true);
    setTimeout(() => { setOrdersVisible(c => c + 5); setOrdersLoading(false); }, 320);
  };
  const showMoreMyOrders = () => {
    setMyOrdersLoading(true);
    setTimeout(() => { setMyOrdersVisible(c => c + 5); setMyOrdersLoading(false); }, 320);
  };
  const showMoreDeals = () => {
    setDealsLoading(true);
    setTimeout(() => { setDealsVisible(c => c + 5); setDealsLoading(false); }, 320);
  };

  const activeOrder = myOrders.find(o => o.status === 'active');

  useEffect(() => {
    if (buyStage !== 'waiting' || !waitingDeal) return;
    const t = setInterval(() => {
      const live = queryOne('SELECT * FROM p2p_deals WHERE id = ?', [waitingDeal.id]);
      if (live && live.status === 'completed') {
        setWaitingDeal(live);
        setBuyStage('done');
        loadAll().then(() => refresh());
      }
    }, 1500);
    return () => clearInterval(t);
  }, [buyStage, waitingDeal, loadAll, refresh]);

  return (
    <div className="fade-up flex-1">
      <div className="glass rounded-3xl p-5 mb-4">
        <div className="flex items-center justify-between gap-3 mb-3">
          <div className="min-w-0">
            <div className="text-[11px] uppercase tracking-[0.16em] text-white/45">Курс LUK / RUB</div>
            <div className="text-3xl font-bold tracking-tight mt-1 tabular-nums">
              {marketStats.hasData && marketStats.rate > 0 ? marketStats.rate.toFixed(2) : '—'}
              <span className="text-white/40 text-base ml-1">₽</span>
            </div>
          </div>
          <div className="shrink-0 text-right">
            <div className="text-[11px] text-white/45">Активных заявок</div>
            <div className="text-lg font-semibold">{orders.length}</div>
          </div>
        </div>

        <div className="grid grid-cols-2 gap-2 mb-4">
          <div className="glass-soft rounded-2xl px-3 py-2 min-w-0">
            <div className="text-[10px] uppercase text-white/40 truncate">Объём за час</div>
            <div className="text-sm font-semibold tabular-nums truncate">
              {formatCompactK(marketStats.hourlyVolume)} <span className="text-[10px] text-amber-300">LUK</span>
            </div>
          </div>
          <div className="glass-soft rounded-2xl px-3 py-2 min-w-0">
            <div className="text-[10px] uppercase text-white/40 truncate">Капитализация</div>
            <div className="text-sm font-semibold tabular-nums truncate">
              {formatCompactK(marketStats.marketCap)} <span className="text-[10px] text-white/40">₽</span>
            </div>
          </div>
        </div>

        <PriceChart points={pricePoints}/>
      </div>

      <div className="glass-soft rounded-2xl p-1 mb-4 grid grid-cols-4 gap-1">
        {[
          { k: 'market', label: 'Рынок' },
          { k: 'my-orders', label: 'Мои' },
          { k: 'my-deals', label: 'Сделки' },
          { k: 'create', label: 'Продать' },
        ].map(t => (
          <button key={t.k} onClick={() => setSub(t.k)}
            className={`py-2 rounded-xl text-[12px] transition truncate
              ${sub === t.k ? 'bg-white/10 text-white' : 'text-white/50 hover:text-white/80'}`}>
            {t.label}
          </button>
        ))}
      </div>

      {sub === 'market' && (
        <div className="space-y-3">
          <div className="glass rounded-3xl p-5">
            <div className="flex items-center justify-between gap-3 mb-3">
              <div className="min-w-0">
                <div className="text-[11px] uppercase tracking-[0.16em] text-white/45">P2P маркет</div>
                <div className="text-sm font-medium mt-0.5">Заявки продавцов</div>
              </div>
              <div className="shrink-0 text-xs px-2.5 py-1 rounded-full bg-amber-400/15 text-amber-300">
                {marketOrders.length}
              </div>
            </div>
            {marketOrders.length === 0 ? (
              <div className="py-10 text-center">
                <div className="w-14 h-14 mx-auto mb-3 rounded-2xl glass-soft flex items-center justify-center text-white/40">
                  <Icon name="shop" size={22}/>
                </div>
                <div className="text-sm text-white/60">Пока нет активных заявок</div>
                <div className="text-xs text-white/40 mt-1">Курс появится, когда появятся заявки</div>
              </div>
            ) : (
              <div className="space-y-2">
                {visibleOrders.map(o => {
                  const isMine = o.seller_id === user.id;
                  const busyOther = o.locked_by && o.locked_by !== user.id;
                  const busySelf = o.locked_by === user.id;
                  const disabled = isMine || busyOther;
                  return (
                    <button key={o.id} onClick={() => !disabled && openBuy(o)}
                      disabled={disabled}
                      className={`list-in w-full text-left p-3.5 rounded-2xl glass-soft transition min-w-0
                        ${disabled ? 'opacity-60 cursor-not-allowed' : 'hover:bg-white/8'}`}>
                      <div className="flex items-center justify-between gap-3 mb-2">
                        <div className="flex items-center gap-2.5 min-w-0">
                          <div className={`w-9 h-9 shrink-0 rounded-xl flex items-center justify-center
                            ${isMine ? 'bg-amber-400/20 text-amber-300' : 'bg-gradient-to-br from-indigo-500/25 to-sky-500/20'}`}>
                            <Icon name="bank" size={16}/>
                          </div>
                          <div className="min-w-0">
                            <div className="text-sm font-medium truncate">{o.bank}</div>
                            <div className="text-[11px] text-white/45 truncate">
                              {shortAddress(o.seller_id)}
                              {isMine && ' · твоя заявка'}
                              {!isMine && busyOther && ' · занято'}
                              {!isMine && busySelf && ' · твоя сделка'}
                            </div>
                          </div>
                        </div>
                        <Icon name="chevron" size={16} className="text-white/30 shrink-0"/>
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        <div className="glass rounded-xl px-3 py-2">
                          <div className="text-[10px] uppercase text-white/40">Доступно</div>
                          <div className="text-sm font-semibold">{formatLuk(o.luk_amount)} LUK</div>
                        </div>
                        <div className="glass rounded-xl px-3 py-2">
                          <div className="text-[10px] uppercase text-white/40">Курс</div>
                          <div className="text-sm font-semibold">{o.rate.toFixed(2)} ₽/LUK</div>
                        </div>
                      </div>
                    </button>
                  );
                })}
                {hasMoreOrders && <ShowMoreButton onClick={showMoreOrders} loading={ordersLoading}/>}
              </div>
            )}
          </div>
        </div>
      )}

      {sub === 'my-orders' && (
        <div className="space-y-3">
          <div className="glass rounded-3xl p-5">
            <div className="flex items-center justify-between gap-3 mb-3">
              <div className="text-[11px] uppercase tracking-[0.16em] text-white/45">Мои заявки</div>
              <div className="text-xs px-2.5 py-1 rounded-full bg-white/8 text-white/60">{myOrders.length}</div>
            </div>
            {activeOrder && (
              <div className="mb-3 p-3.5 rounded-2xl bg-amber-400/10 border border-amber-400/20">
                <div className="flex items-center gap-2 mb-1">
                  <Icon name="clock" size={14} className="text-amber-300"/>
                  <div className="text-sm font-medium text-amber-200">Активная заявка</div>
                </div>
                <div className="text-[12px] text-white/60">
                  {formatLuk(activeOrder.luk_amount)} LUK за {formatMoney(activeOrder.rub_amount)} · {activeOrder.bank}
                </div>
              </div>
            )}

            {myOrders.length === 0 ? (
              <div className="py-10 text-center">
                <div className="w-14 h-14 mx-auto mb-3 rounded-2xl glass-soft flex items-center justify-center text-white/40">
                  <Icon name="tag" size={22}/>
                </div>
                <div className="text-sm text-white/60">Заявок нет</div>
                <div className="text-xs text-white/40 mt-1">Создай в разделе «Продать»</div>
              </div>
            ) : (
              <div className="space-y-2">
                {visibleMyOrders.map(o => (
                  <div key={o.id} className="list-in p-3.5 rounded-2xl glass-soft">
                    <div className="flex items-center justify-between gap-3 mb-2">
                      <div className="min-w-0">
                        <div className="text-sm font-medium truncate">
                          {formatLuk(o.luk_amount)} LUK · {formatMoney(o.rub_amount)}
                        </div>
                        <div className="text-[11px] text-white/45 truncate">
                          {o.bank} · {o.phone} · курс {o.rate.toFixed(2)}
                        </div>
                      </div>
                      <span className={`shrink-0 text-[10px] px-2 py-1 rounded-full ${
                        o.status === 'active' ? 'bg-emerald-400/15 text-emerald-300' :
                        o.status === 'filled' ? 'bg-indigo-400/15 text-indigo-300' :
                        'bg-white/8 text-white/50'
                      }`}>
                        {o.status === 'active' ? (o.locked_by ? 'занята' : 'активна') :
                         o.status === 'filled' ? 'исполнена' : 'отменена'}
                      </span>
                    </div>
                    {o.status === 'active' && !o.locked_by && (
                      <button onClick={() => cancelOrder(o.id)}
                        className="w-full py-2 rounded-xl bg-red-500/10 border border-red-400/25 text-red-200 text-xs font-medium hover:bg-red-500/15 transition">
                        Отменить заявку
                      </button>
                    )}
                    {o.status === 'active' && o.locked_by && (
                      <div className="text-[11px] text-amber-200/80 pt-1">
                        Заявка занята покупателем, ожидается исполнение
                      </div>
                    )}
                  </div>
                ))}
                {hasMoreMyOrders && <ShowMoreButton onClick={showMoreMyOrders} loading={myOrdersLoading}/>}
              </div>
            )}
          </div>
        </div>
      )}

      {sub === 'my-deals' && (
        <div className="glass rounded-3xl p-5">
          <div className="flex items-center justify-between gap-3 mb-3">
            <div className="text-[11px] uppercase tracking-[0.16em] text-white/45">Мои сделки</div>
            <div className="text-xs px-2.5 py-1 rounded-full bg-white/8 text-white/60">{myDeals.length}</div>
          </div>
          {myDeals.length === 0 ? (
            <div className="py-10 text-center">
              <div className="w-14 h-14 mx-auto mb-3 rounded-2xl glass-soft flex items-center justify-center text-white/40">
                <Icon name="exchange" size={22}/>
              </div>
              <div className="text-sm text-white/60">Сделок пока нет</div>
            </div>
          ) : (
            <div className="space-y-2">
              {visibleDeals.map(d => {
                const isSeller = d.seller_id === user.id;
                const needsSellerAction = isSeller && d.status === 'pending' && d.buyer_op_id && !d.seller_op_id;
                const remain = d.deadline_at ? Math.max(0, Math.round((d.deadline_at - Date.now()) / 1000)) : 0;
                return (
                  <div key={d.id} className="list-in p-3.5 rounded-2xl glass-soft">
                    <div className="flex items-center justify-between gap-3 mb-2">
                      <div className="text-[11px] uppercase tracking-wider text-white/40">
                        {isSeller ? 'Продажа' : 'Покупка'}
                      </div>
                      <span className={`text-[10px] px-2 py-1 rounded-full ${
                        d.status === 'completed' ? 'bg-emerald-400/15 text-emerald-300' :
                        d.status === 'pending' ? 'bg-amber-400/15 text-amber-300' :
                        'bg-white/8 text-white/50'
                      }`}>
                        {d.status === 'completed' ? (d.auto_executed ? 'авто' : 'завершена') :
                         d.status === 'pending' ? 'в процессе' : d.status}
                      </span>
                    </div>
                    <div className="grid grid-cols-2 gap-2 mb-2">
                      <div className="glass rounded-xl px-3 py-2">
                        <div className="text-[10px] uppercase text-white/40">LUK</div>
                        <div className="text-sm font-semibold">{formatLuk(d.luk_amount)}</div>
                      </div>
                      <div className="glass rounded-xl px-3 py-2">
                        <div className="text-[10px] uppercase text-white/40">Рубли</div>
                        <div className="text-sm font-semibold">{formatMoney(d.rub_amount)}</div>
                      </div>
                    </div>

                    {d.status === 'pending' && d.deadline_at && (
                      <div className="mb-2 flex items-center justify-between text-[11px]">
                        <span className="text-white/45">Автоисполнение через</span>
                        <span className={`font-mono font-semibold tabular-nums ${remain < 180 ? 'text-rose-300' : 'text-amber-200'}`}>
                          {formatTimer(remain)}
                        </span>
                      </div>
                    )}

                    {d.status === 'completed' && d.commission > 0 && (
                      <div className="text-[11px] text-white/45 truncate">
                        Комиссия: {formatMoney(d.commission)}
                        {d.auto_executed ? ' · автоисполнение' : ''}
                      </div>
                    )}
                    {d.status === 'completed' && d.commission === 0 && !d.auto_executed && (
                      <div className="text-[11px] text-emerald-300/90 truncate">
                        Комиссия не взята · быстрая сделка
                      </div>
                    )}

                    {needsSellerAction && (
                      <button onClick={() => { setSellerDeal(d); setSellerOpId(''); setSellerError(''); }}
                        className="mt-2 w-full py-2.5 rounded-xl bg-indigo-500/20 border border-indigo-400/30 text-indigo-100 text-xs font-medium hover:bg-indigo-500/30 transition">
                        Подтвердить сделку
                      </button>
                    )}
                  </div>
                );
              })}
              {hasMoreDeals && <ShowMoreButton onClick={showMoreDeals} loading={dealsLoading}/>}
            </div>
          )}
        </div>
      )}

      {sub === 'create' && (
        <div className="glass rounded-3xl p-5 sm:p-6">
          <div className="flex items-center gap-3 mb-5 min-w-0">
            <div className="w-11 h-11 shrink-0 rounded-2xl bg-amber-400/15 flex items-center justify-center text-amber-300">
              <Icon name="tag" size={20}/>
            </div>
            <div className="min-w-0">
              <div className="text-[11px] uppercase tracking-[0.16em] text-white/40">Продать</div>
              <div className="text-sm font-semibold truncate">Создать P2P заявку</div>
            </div>
          </div>

          {activeOrder && (
            <Alert kind="warn">
              У тебя уже есть активная заявка. Отмени её, чтобы создать новую.
            </Alert>
          )}

          <div className="space-y-4 mt-4">
            <Field label="Сколько LUK хотите продать?">
              <div className="relative">
                <input value={formLuk} onChange={(e) => setFormLuk(e.target.value)}
                  placeholder="0" inputMode="decimal" disabled={!!activeOrder || formLoading}
                  className="glass-input w-full rounded-2xl px-4 py-3 pr-16 outline-none text-lg disabled:opacity-50"/>
                <span className="absolute right-4 top-1/2 -translate-y-1/2 text-amber-300 font-semibold text-sm">LUK</span>
              </div>
              <div className="mt-2 text-[11px] text-white/45">
                Доступно: {formatLuk(balance)} LUK · Лимит: {formatLuk(user.transferLimit ?? 1000000)} LUK
              </div>
            </Field>
            <Field label={`За сколько хотите продать ${formLuk || 'N'} LUK?`}>
              <div className="relative">
                <input value={formRub} onChange={(e) => setFormRub(e.target.value)}
                  placeholder="0" inputMode="decimal" disabled={!!activeOrder || formLoading}
                  className="glass-input w-full rounded-2xl px-4 py-3 pr-12 outline-none text-lg disabled:opacity-50"/>
                <span className="absolute right-4 top-1/2 -translate-y-1/2 text-white/50 font-semibold text-sm">₽</span>
              </div>
              {formLuk && formRub && parseFloat(formRub) > 0 && parseFloat(formLuk) > 0 && (
                <div className="mt-2 text-[11px] text-white/55">
                  Курс: {(parseFloat(formRub) / parseFloat(formLuk)).toFixed(2)} ₽/LUK
                  {marketStats.rate > 0 && <> · Рыночный: {marketStats.rate.toFixed(2)} ₽/LUK</>}
                </div>
              )}
            </Field>
            <Field label="Название банка (СБП)">
              <input value={formBank} onChange={(e) => setFormBank(e.target.value)}
                placeholder="Сбербанк, Тинькофф, Альфа-Банк" disabled={!!activeOrder || formLoading}
                className="glass-input w-full rounded-2xl px-4 py-3 outline-none disabled:opacity-50"/>
            </Field>
            <Field label="Номер телефона">
              <input value={formPhone} onChange={(e) => setFormPhone(e.target.value)}
                placeholder="+7 999 123-45-67" inputMode="tel" disabled={!!activeOrder || formLoading}
                className="glass-input w-full rounded-2xl px-4 py-3 outline-none font-mono text-sm disabled:opacity-50"/>
            </Field>

            {formError && <Alert>{formError}</Alert>}

            <div className="glass-soft rounded-2xl p-3.5 space-y-2">
              <div className="flex items-start gap-2.5">
                <Icon name="info" size={14} className="text-amber-300 mt-0.5 shrink-0"/>
                <div className="text-[11px] text-white/60 leading-relaxed">
                  При создании заявки LUK замораживаются. Комиссия платформы — 5% с продавца.
                </div>
              </div>
              <div className="flex items-start gap-2.5">
                <Icon name="shieldAlert" size={14} className="text-indigo-300 mt-0.5 shrink-0"/>
                <div className="text-[11px] text-white/60 leading-relaxed">
                  ID операции сверяется между покупателем и продавцом. Если не совпадут — сделка не исполнится.
                </div>
              </div>
              <div className="flex items-start gap-2.5">
                <Icon name="medal" size={14} className="text-amber-300 mt-0.5 shrink-0"/>
                <div className="text-[11px] text-white/60 leading-relaxed">
                  Быстрая сделка — комиссия не берётся, плюс бонус к лимиту ×5 от суммы сделки.
                </div>
              </div>
            </div>

            <button onClick={createOrder} disabled={!!activeOrder || formLoading}
              className="btn-primary relative overflow-hidden py-3.5 rounded-2xl text-sm font-medium w-full disabled:opacity-40">
              {formLoading && <span className="load-bar"/>}
              <span className={formLoading ? 'opacity-70' : ''}>
                {formLoading ? 'Создание…' : 'Создать заявку'}
              </span>
            </button>
          </div>
        </div>
      )}

      <BottomSheet isOpen={!!buyOrder} onClose={() => !['waiting'].includes(buyStage) && setBuyOrder(null)}
        title={
          buyStage === 'payment' ? 'Оплата' :
          buyStage === 'opid' ? 'ID операции' :
          buyStage === 'waiting' ? 'Статус сделки' :
          buyStage === 'done' ? 'Сделка завершена' : 'Покупка LUK'
        }
        dismissable={buyStage !== 'waiting'}>
        {buyOrder && buyStage === 'amount' && (
          <div className="space-y-4">
            <div className="glass-soft rounded-2xl p-4">
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <div className="text-[10px] uppercase text-white/40">Доступно</div>
                  <div className="text-sm font-semibold">{formatLuk(buyOrder.luk_amount)} LUK</div>
                </div>
                <div>
                  <div className="text-[10px] uppercase text-white/40">Курс</div>
                  <div className="text-sm font-semibold">{buyOrder.rate.toFixed(2)} ₽/LUK</div>
                </div>
              </div>
            </div>

            <Field label="Сколько LUK купить?">
              <div className="relative">
                <input value={buyLukAmount} onChange={(e) => setBuyLukAmount(e.target.value)}
                  placeholder="0" inputMode="decimal" autoFocus disabled={buyLoading}
                  className="glass-input w-full rounded-2xl px-4 py-3 pr-16 outline-none text-lg disabled:opacity-60"/>
                <span className="absolute right-4 top-1/2 -translate-y-1/2 text-amber-300 font-semibold text-sm">LUK</span>
              </div>
              {buyLukAmount && parseFloat(buyLukAmount) > 0 && (
                <div className="mt-2 text-[11px] text-white/55">
                  К оплате: {formatMoney(calcRub(parseFloat(buyLukAmount)))}
                </div>
              )}
            </Field>

            <div className="flex gap-2">
              {[25, 50, 75, 100].map(pct => (
                <button key={pct} onClick={() => setBuyLukAmount(((buyOrder.luk_amount * pct) / 100).toFixed(2))}
                  disabled={buyLoading}
                  className="flex-1 py-2 rounded-xl glass-soft text-xs text-white/70 hover:bg-white/8 transition disabled:opacity-50">
                  {pct}%
                </button>
              ))}
            </div>

            {buyError && <Alert>{buyError}</Alert>}

            <button onClick={submitBuy} disabled={buyLoading}
              className="btn-primary relative overflow-hidden py-3.5 rounded-2xl text-sm font-medium w-full">
              {buyLoading && <span className="load-bar"/>}
              <span className={buyLoading ? 'opacity-70' : ''}>{buyLoading ? 'Обработка…' : 'Купить'}</span>
            </button>
          </div>
        )}

        {buyOrder && buyStage === 'payment' && (
          <div className="space-y-4">
            <div className="relative rounded-3xl p-5 overflow-hidden bg-gradient-to-br from-indigo-600 to-violet-700">
              <div className="absolute -right-6 -top-6 w-32 h-32 bg-white/15 rounded-full blur-2xl"></div>
              <div className="relative space-y-4">
                <div>
                  <div className="text-indigo-200 text-[11px] font-bold uppercase tracking-wider mb-1.5">Банк получателя</div>
                  <div className="text-xl font-bold">{buyOrder.bank}</div>
                </div>
                <div>
                  <div className="text-indigo-200 text-[11px] font-bold uppercase tracking-wider mb-1.5">Телефон</div>
                  <div className="text-xl font-bold font-mono tracking-tight">{buyOrder.phone}</div>
                </div>
                <div className="flex justify-between items-end pt-3 border-t border-white/20">
                  <div>
                    <div className="text-indigo-200 text-[11px] font-bold uppercase tracking-wider mb-1">LUK</div>
                    <div className="text-lg font-bold tabular-nums">{formatLuk(parseFloat(buyLukAmount))}</div>
                  </div>
                  <div className="text-right">
                    <div className="text-indigo-200 text-[11px] font-bold uppercase tracking-wider mb-1">К оплате</div>
                    <div className="text-lg font-bold tabular-nums">{formatMoney(buyRubAmount)}</div>
                  </div>
                </div>
              </div>
            </div>

            <div className="glass-soft rounded-2xl p-3.5">
              <div className="flex items-start gap-2.5">
                <Icon name="info" size={14} className="text-indigo-300 mt-0.5 shrink-0"/>
                <div className="text-[11px] text-white/60 leading-relaxed">
                  Переведи сумму по СБП. Затем нажми «Я оплатил» и введи ID операции из банка.
                </div>
              </div>
            </div>

            <div className="grid grid-cols-2 gap-2">
              <button onClick={() => { navigator.clipboard?.writeText(buyOrder.phone).catch(()=>{}); }}
                className="btn-ghost py-3 rounded-2xl text-xs font-medium flex items-center justify-center gap-2">
                <Icon name="copy" size={14}/> Номер
              </button>
              <button onClick={() => { navigator.clipboard?.writeText(String(buyRubAmount)).catch(()=>{}); }}
                className="btn-ghost py-3 rounded-2xl text-xs font-medium flex items-center justify-center gap-2">
                <Icon name="copy" size={14}/> Сумма
              </button>
            </div>

            <button onClick={() => setBuyStage('opid')}
              className="btn-primary py-3.5 rounded-2xl text-sm font-medium w-full">
              Я оплатил
            </button>
          </div>
        )}

        {buyOrder && buyStage === 'opid' && (
          <div className="space-y-4">
            <Field label="ID операции из банка"
              hint="Формат: заглавные буквы и цифры, минимум 15 символов. Пример: A6227022310219040G10070011830701">
              <input value={buyOpId}
                onChange={(e) => setBuyOpId(normalizeOperationId(e.target.value))}
                placeholder="A6227022310219040G10070011830701" autoFocus disabled={buyLoading}
                className="glass-input w-full rounded-2xl px-4 py-3 outline-none font-mono text-sm uppercase tracking-wider disabled:opacity-60"/>
            </Field>

            {buyError && <Alert>{buyError}</Alert>}

            <div className="flex gap-2">
              <button onClick={() => setBuyStage('payment')} disabled={buyLoading} className="btn-ghost flex-1 py-3.5 rounded-2xl text-sm disabled:opacity-50">Назад</button>
              <button onClick={submitBuyerOpId} disabled={buyLoading}
                className="btn-primary relative overflow-hidden flex-1 py-3.5 rounded-2xl text-sm font-medium">
                {buyLoading && <span className="load-bar"/>}
                <span className={buyLoading ? 'opacity-70' : ''}>{buyLoading ? 'Отправка…' : 'Подтвердить'}</span>
              </button>
            </div>
          </div>
        )}

        {buyOrder && buyStage === 'waiting' && waitingDeal && (
          <div className="space-y-5 fade-up">
            <div className="text-center">
              <div className="w-20 h-20 mx-auto mb-5 rounded-full bg-amber-400/15 flex items-center justify-center text-amber-300">
                <div className="w-10 h-10 border-4 border-amber-300/30 border-t-amber-300 rounded-full animate-spin"></div>
              </div>
              <h2 className="text-xl font-semibold mb-1">Ожидаем продавца</h2>
              <p className="text-white/55 text-sm">
                Заявка закреплена за тобой. Продавец сверит ID и подтвердит сделку.
              </p>
            </div>

            <div className="glass-soft rounded-2xl p-4">
              <div className="text-[11px] uppercase tracking-wider text-white/40 mb-3">Твоя заявка</div>
              <div className="space-y-2.5">
                <div className="flex justify-between text-sm">
                  <span className="text-white/55">Статус</span>
                  <span className="inline-flex items-center gap-1.5 text-amber-300 font-medium">
                    <span className="w-1.5 h-1.5 rounded-full bg-amber-300 animate-pulse"/> На проверке
                  </span>
                </div>
                <div className="flex justify-between text-sm">
                  <span className="text-white/55">LUK</span>
                  <span className="font-semibold">{formatLuk(waitingDeal.luk_amount)}</span>
                </div>
                <div className="flex justify-between text-sm">
                  <span className="text-white/55">Рубли</span>
                  <span className="font-semibold">{formatMoney(waitingDeal.rub_amount)}</span>
                </div>
                <div className="flex justify-between text-sm">
                  <span className="text-white/55">Продавец</span>
                  <span className="font-mono text-xs">{shortAddress(waitingDeal.seller_id)}</span>
                </div>
                {waitingDeal.deadline_at && (
                  <div className="flex justify-between text-sm">
                    <span className="text-white/55">Автоисполнение</span>
                    <span className="font-mono font-semibold text-amber-200">
                      {formatTimer(Math.max(0, Math.round((waitingDeal.deadline_at - Date.now()) / 1000)))}
                    </span>
                  </div>
                )}
              </div>
            </div>

            <button onClick={() => { setBuyOrder(null); setWaitingDeal(null); setBuyStage('amount'); }}
              className="btn-ghost py-3.5 rounded-2xl text-sm w-full">
              Закрыть
            </button>
          </div>
        )}

        {buyOrder && buyStage === 'done' && waitingDeal && (
          <div className="py-4 text-center fade-up">
            <div className="w-20 h-20 mx-auto mb-5 rounded-full bg-emerald-400/15 flex items-center justify-center text-emerald-300">
              <Icon name="check" size={34}/>
            </div>
            <h2 className="text-2xl font-semibold mb-2">Сделка завершена</h2>
            <p className="text-white/55 text-sm mb-6">
              Продавец подтвердил оплату. LUK зачислены на твой баланс.
            </p>
            <div className="glass-soft rounded-2xl p-4 text-left mb-5">
              <div className="space-y-2 text-[12px]">
                <div className="flex justify-between"><span className="text-white/55">LUK</span><span className="font-semibold">{formatLuk(waitingDeal.luk_amount)}</span></div>
                <div className="flex justify-between"><span className="text-white/55">Рубли</span><span className="font-semibold">{formatMoney(waitingDeal.rub_amount)}</span></div>
              </div>
            </div>
            <button onClick={() => { setBuyOrder(null); setWaitingDeal(null); setBuyStage('amount'); }}
              className="btn-primary py-3.5 rounded-2xl text-sm font-medium w-full">
              Отлично
            </button>
          </div>
        )}
      </BottomSheet>

      <BottomSheet isOpen={!!sellerDeal} onClose={() => !sellerLoading && setSellerDeal(null)} title="Подтвердить сделку" dismissable={!sellerLoading}>
        {sellerDeal && (
          <div className="space-y-4">
            <div className="glass-soft rounded-2xl p-4 space-y-2.5">
              <div className="flex justify-between text-sm">
                <span className="text-white/55">LUK</span>
                <span className="font-semibold">{formatLuk(sellerDeal.luk_amount)}</span>
              </div>
              <div className="flex justify-between text-sm">
                <span className="text-white/55">Рубли</span>
                <span className="font-semibold">{formatMoney(sellerDeal.rub_amount)}</span>
              </div>
              <div className="flex justify-between text-sm">
                <span className="text-white/55">Покупатель</span>
                <span className="font-mono text-xs">{shortAddress(sellerDeal.buyer_id)}</span>
              </div>
              {sellerDeal.deadline_at && (
                <div className="flex justify-between text-sm">
                  <span className="text-white/55">Автоисполнение через</span>
                  <span className="font-mono font-semibold text-amber-200">
                    {formatTimer(Math.max(0, Math.round((sellerDeal.deadline_at - Date.now()) / 1000)))}
                  </span>
                </div>
              )}
            </div>

            <div className="glass-soft rounded-2xl p-3.5 space-y-2">
              <div className="flex items-start gap-2.5">
                <Icon name="shieldAlert" size={14} className="text-indigo-300 mt-0.5 shrink-0"/>
                <div className="text-[11px] text-white/60 leading-relaxed">
                  Введи тот же ID операции, что указал покупатель. Система сверит их — если не совпадут, сделка не исполнится.
                </div>
              </div>
              <div className="flex items-start gap-2.5">
                <Icon name="trend" size={14} className="text-amber-300 mt-0.5 shrink-0"/>
                <div className="text-[11px] text-white/60 leading-relaxed">
                  Быстрее 2 минут — комиссия не берётся, плюс бонус к лимиту ×5 от суммы сделки.
                </div>
              </div>
            </div>

            <Field label="ID операции из банка">
              <input value={sellerOpId}
                onChange={(e) => setSellerOpId(normalizeOperationId(e.target.value))}
                placeholder="A6227022310219040G10070011830701" autoFocus disabled={sellerLoading}
                className="glass-input w-full rounded-2xl px-4 py-3 outline-none font-mono text-sm uppercase tracking-wider disabled:opacity-60"/>
            </Field>

            {sellerError && <Alert>{sellerError}</Alert>}

            <button onClick={submitSellerOpId} disabled={sellerLoading}
              className="btn-primary relative overflow-hidden py-3.5 rounded-2xl text-sm font-medium w-full">
              {sellerLoading && <span className="load-bar"/>}
              <span className={sellerLoading ? 'opacity-70' : ''}>{sellerLoading ? 'Проверка…' : 'Подтвердить сделку'}</span>
            </button>
          </div>
        )}
      </BottomSheet>
    </div>
  );
}

/* ============================================================
   Loading
   ============================================================ */

function Loading() {
  return (
    <div className="fs-shell fs-center">
      <div className="fs-card">
        <div className="glass rounded-3xl p-7 sm:p-8 shadow-glow">
          <div className="flex items-center gap-3 mb-6">
            <Logo size={40}/>
            <div className="h-4 w-32 rounded shimmer"/>
          </div>
          <div className="h-8 w-3/4 rounded shimmer mb-3"/>
          <div className="h-4 w-2/3 rounded shimmer mb-8"/>
          <div className="h-14 w-full rounded-2xl shimmer"/>
        </div>
      </div>
    </div>
  );
}

function guessDeviceName() {
  const ua = navigator.userAgent;
  if (/iPhone/.test(ua)) return 'iPhone · Safari';
  if (/iPad/.test(ua)) return 'iPad · Safari';
  if (/Android/.test(ua)) return 'Android · Chrome';
  if (/Mac/.test(ua)) return 'Mac · Chrome';
  if (/Windows/.test(ua)) return 'Windows · Chrome';
  return 'Браузер';
}

/* ============================================================
   App
   ============================================================ */

function App() {
  const [ready, setReady] = useState(false);
  const [unsupported, setUnsupported] = useState(null);
  const [screen, setScreen] = useState('loading');
  const [user, setUser] = useState(null);
  const [fingerprint, setFingerprint] = useState('');
  const [fatal, setFatal] = useState('');

  useEffect(() => {
    (async () => {
      try {
        const support = await checkBrowserSupport();
        if (!support.ok) { setUnsupported(support.missing); return; }

        SQL = await initSqlJs({
          locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${f}`,
        });

        dbKey = await getOrCreateDbKey();
        db = await loadDB();
        initSchema();
        await persistDB();

        const fp = await getStableFingerprint();
        setFingerprint(fp);
        setReady(true);
      } catch (e) {
        setFatal('Не удалось инициализировать приложение: ' + (e?.message || e));
      }
    })();
  }, []);

  useEffect(() => {
    if (!ready) return;
    (async () => {
      await wait(300);

      const total = queryOne('SELECT COUNT(*) as c FROM users')?.c || 0;

      if (total === 0) {
        setScreen('choice');
        return;
      }

      let userRow = queryOne('SELECT * FROM users WHERE fingerprint_id = ?', [fingerprint]);

      if (!userRow && total === 1) {
        const all = queryAll('SELECT * FROM users LIMIT 2');
        userRow = all[0];
      }

      if (!userRow) {
        setScreen('choice');
        return;
      }

      const u = rowToUser(userRow);
      setUser(u);
      const d = queryOne('SELECT * FROM devices WHERE id = ? AND user_id = ?', [fingerprint, u.id]);
      if (d) setScreen('login');
      else setScreen('choice');
    })();
  }, [ready, fingerprint]);

  const finishLogin = async () => {
    if (!user) return;
    const d = queryOne('SELECT * FROM devices WHERE id = ? AND user_id = ?', [fingerprint, user.id]);
    if (!d) { setScreen('choice'); return; }

    run('UPDATE devices SET last_seen = ? WHERE id = ? AND user_id = ?', [Date.now(), fingerprint, user.id]);
    run('UPDATE users SET last_login = ? WHERE id = ?', [Date.now(), user.id]);
    run('UPDATE users SET trust_score = MIN(100, trust_score + 1) WHERE id = ?', [user.id]);
    if (!user.fingerprintId) {
      run('UPDATE users SET fingerprint_id = ? WHERE id = ?', [fingerprint, user.id]);
    }
    await audit('login', `addr=${user.id.slice(0, 12)}`);
    await createSession(user.id, fingerprint);
    await persistDB();

    const u = rowToUser(queryOne('SELECT * FROM users WHERE id = ?', [user.id]));
    setUser(u);
    setScreen('app');
  };

  const logout = () => setScreen('login');

  const refreshUser = async () => {
    if (!user) return;
    const u = rowToUser(queryOne('SELECT * FROM users WHERE id = ?', [user.id]));
    if (u) setUser(u);
  };

  const handleOnboardingComplete = (u) => {
    setUser(u);
    setScreen('firstlogin');
  };

  const handleFirstLoginDone = () => {
    setScreen('app');
  };

  const handleRecoveryRestored = async (restoredUser) => {
    if (!restoredUser) return;
    setUser(restoredUser);
    await createSession(restoredUser.id, fingerprint);
    setScreen('app');
  };

  const goChoice = () => setScreen('choice');
  const goOnboarding = () => setScreen('onboarding');
  const goRecover = () => setScreen('recovery');

  if (unsupported) return <ScreenUnsupported missing={unsupported}/>;
  if (fatal) {
    return (
      <div className="fs-shell fs-center">
        <div className="fs-card glass rounded-3xl p-8 text-center">
          <div className="text-lg font-semibold mb-2">Ошибка инициализации</div>
          <div className="text-sm text-white/60 break-words">{fatal}</div>
        </div>
      </div>
    );
  }

  return (
    <>
      {(!ready || screen === 'loading') && <Loading/>}
      {ready && screen === 'choice' && (
        <ScreenChoice onCreate={goOnboarding} onRecover={goRecover}/>
      )}
      {ready && screen === 'onboarding' && (
        <ScreenOnboarding fingerprint={fingerprint} onComplete={handleOnboardingComplete}/>
      )}
      {ready && screen === 'firstlogin' && user && (
        <ScreenFirstLogin user={user} onDone={handleFirstLoginDone}/>
      )}
      {ready && screen === 'login' && user && (
        <ScreenLogin user={user} onLogin={finishLogin}/>
      )}
      {ready && screen === 'recovery' && (
        <ScreenRecoveryFromFile onBack={goChoice} onRestored={handleRecoveryRestored}/>
      )}
      {ready && screen === 'app' && user && (
        <ScreenApp user={user} onLogout={logout} refreshUser={refreshUser}/>
      )}
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
