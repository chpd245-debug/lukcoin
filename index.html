function labelForKind(k) {
  return {
    genesis: 'Создание кошелька',
    send: 'Отправлено',
    receive: 'Получено',
    send_fee: 'Комиссия за перевод',
    p2p_buy: 'Покупка LUK',
    p2p_sell: 'Продажа LUK',
    p2p_commission: 'Комиссия P2P',
    p2p_commission_waived: 'Комиссия не взята (быстрая сделка)',
    p2p_refund: 'Возврат по сделке',
    p2p_seller_auto: 'Автоисполнение продавца',
    p2p_limit_bonus: 'Бонус к лимиту',
    mining_reward: 'Награда за майнинг',
    mining_withdraw: 'Вывод с майнинга',
  }[k] || k;
}

/* ============================================================
   Mining Tab
   ============================================================ */

function MiningTab({ user, refresh, refreshUser }) {
  const [miningBalance, setMiningBalance] = useState(user.miningBalance || 0);
  const [currentTask, setCurrentTask] = useState(null);
  const [taskAnswers, setTaskAnswers] = useState([]);
  const [downloadedTask, setDownloadedTask] = useState(false);
  const [checking, setChecking] = useState(false);
  const [withdrawing, setWithdrawing] = useState(false);
  const [result, setResult] = useState(null);
  const [error, setError] = useState('');
  const [history, setHistory] = useState([]);

  const reload = useCallback(() => {
    const u = rowToUser(queryOne('SELECT * FROM users WHERE id = ?', [user.id]));
    if (u) setMiningBalance(u.miningBalance || 0);
    const h = queryAll(`SELECT * FROM transactions WHERE user_id = ? AND kind IN ('mining_reward','mining_withdraw') ORDER BY ts DESC LIMIT 50`, [user.id]);
    setHistory(h);
  }, [user.id]);

  useEffect(() => { reload(); }, [reload]);

  const startTask = () => {
    setError('');
    setResult(null);
    const task = generateMiningTask();
    setCurrentTask(task);
    setTaskAnswers(Array(task.tilesCount).fill(''));
    setDownloadedTask(false);
  };

  const downloadTask = () => {
    if (!currentTask) return;
    try {
      const blob = hchToBlob(currentTask);
      downloadBlob(blob, `task-${currentTask.taskId}.hch`);
      setDownloadedTask(true);
    } catch (e) {
      setError('Не удалось создать файл задачи.');
    }
  };

  const submitAnswer = async () => {
    if (!currentTask) return;
    setError('');
    setChecking(true);
    await wait(300);

    try {
      // Здесь мы не читаем .hch заново — проверяем по данным task
      const answers = currentTask.tiles.map(t => t.targetColor);
      const res = checkMiningAnswer(taskAnswers, answers);
      setResult(res);

      if (res.ok) {
        const reward = res.rewardLuk;
        run('UPDATE users SET mining_balance = mining_balance + ? WHERE id = ?', [reward, user.id]);
        run('INSERT INTO transactions (id, user_id, kind, amount, counterparty, note, ts) VALUES (?, ?, ?, ?, ?, ?, ?)',
          [uuid(), user.id, 'mining_reward', reward, 'LUK Mining', `Задача ${currentTask.taskId} · ${currentTask.totalBytes} байт`, Date.now()]);
        await audit('mining_reward', `${reward} LUK, ${currentTask.totalBytes} bytes`);
        await persistDB();
        reload();
      }
    } catch (e) {
      setError('Ошибка проверки задачи.');
    }
    setChecking(false);
  };

  const withdraw = async () => {
    setError('');
    setWithdrawing(true);
    await wait(400);
    const amt = miningBalance;
    if (amt < 0.01) { setError('Минимум для вывода — 0.01 LUK.'); setWithdrawing(false); return; }
    try {
      run('UPDATE users SET mining_balance = 0, luk_balance = luk_balance + ? WHERE id = ?', [amt, user.id]);
      run('INSERT INTO transactions (id, user_id, kind, amount, counterparty, note, ts) VALUES (?, ?, ?, ?, ?, ?, ?)',
        [uuid(), user.id, 'mining_withdraw', amt, 'LUK Mining', 'Вывод майнинг-баланса на основной', Date.now()]);
      await audit('mining_withdraw', `${amt} LUK`);
      await persistDB();
      reload();
      refresh();
      refreshUser?.();
    } catch (e) {
      setError('Не удалось вывести средства.');
    }
    setWithdrawing(false);
  };

  const previewTile = (tile, idx) => {
    // Рисуем плитку в <canvas>
    const size = 96;
    const cell = size / tile.gridSize;
    return (
      <canvas
        key={idx}
        width={size}
        height={size}
        className="rounded-xl border border-white/10 hash-canvas"
        ref={(canvas) => {
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, size, size);
          for (let y = 0; y < tile.gridSize; y++) {
            for (let x = 0; x < tile.gridSize; x++) {
              const i = (y * tile.gridSize + x) * 3;
              const r = tile.pixels[i], g = tile.pixels[i+1], b = tile.pixels[i+2];
              ctx.fillStyle = `rgb(${r},${g},${b})`;
              ctx.fillRect(x * cell, y * cell, cell, cell);
            }
          }
        }}
      />
    );
  };

  return (
    <div className="fade-up flex-1 flex flex-col gap-4">
      <div className="glass rounded-3xl p-5 sm:p-6 shadow-glow">
        <div className="flex items-center justify-between gap-3 mb-3">
          <div className="min-w-0">
            <div className="text-[11px] uppercase tracking-[0.16em] text-white/45">Майнинг</div>
            <div className="text-sm font-medium mt-0.5">Задачи .hch · цветовой анализ</div>
          </div>
          <div className="shrink-0 w-10 h-10 rounded-2xl bg-amber-400/15 flex items-center justify-center text-amber-300">
            <Icon name="pickaxe" size={18}/>
          </div>
        </div>

        <div className="grid grid-cols-2 gap-2 mb-4">
          <div className="glass-soft rounded-2xl px-3 py-2">
            <div className="text-[10px] uppercase text-white/40">Майнинг-баланс</div>
            <div className="text-lg font-bold tabular-nums">{formatLuk(miningBalance)} <span className="text-[10px] text-amber-300">LUK</span></div>
          </div>
          <div className="glass-soft rounded-2xl px-3 py-2">
            <div className="text-[10px] uppercase text-white/40">Мин. вывод</div>
            <div className="text-lg font-bold tabular-nums">0.01 <span className="text-[10px] text-amber-300">LUK</span></div>
          </div>
        </div>

        <div className="grid grid-cols-2 gap-2">
          <button onClick={startTask}
            className="btn-primary py-3 rounded-2xl flex items-center justify-center gap-2 text-sm font-medium">
            <Icon name="spark" size={16}/> Новая задача
          </button>
          <button onClick={withdraw} disabled={miningBalance < 0.01 || withdrawing}
            className="btn-ghost py-3 rounded-2xl flex items-center justify-center gap-2 text-sm font-medium disabled:opacity-40">
            {withdrawing ? <span className="load-bar"/> : <Icon name="upload" size={16}/>}
            {withdrawing ? 'Вывод…' : 'Вывести'}
          </button>
        </div>

        <div className="mt-4 flex items-start gap-2.5 p-3.5 glass-soft rounded-2xl">
          <Icon name="info" size={14} className="text-indigo-300 mt-0.5 shrink-0"/>
          <div className="text-[11px] text-white/60 leading-relaxed">
            Скачай .hch, определи доминирующий цвет каждой плитки (hex, например <span className="font-mono">#3FA9F5</span>) и введи ответ. Награда = <span className="font-semibold">0.01 LUK × плиток</span>. Допуск по каналам ±20.
          </div>
        </div>
      </div>

      {currentTask && (
        <div className="glass rounded-3xl p-5 sm:p-6">
          <div className="flex items-center justify-between gap-3 mb-4">
            <div className="min-w-0">
              <div className="text-[11px] uppercase tracking-[0.16em] text-white/45">Задача</div>
              <div className="text-sm font-medium mt-0.5 font-mono truncate">{currentTask.taskId}</div>
            </div>
            <div className="shrink-0 text-[11px] text-white/50">
              {currentTask.tilesCount} плит. · {currentTask.totalBytes} байт
            </div>
          </div>

          <button onClick={downloadTask}
            className="btn-primary w-full py-3 rounded-2xl flex items-center justify-center gap-2 text-sm font-medium mb-4">
            <Icon name={downloadedTask ? 'check' : 'download'} size={16}/>
            {downloadedTask ? 'Скачано · ' + currentTask.taskId + '.hch' : 'Скачать .hch'}
          </button>

          <div className="space-y-4">
            {currentTask.tiles.map((tile, idx) => (
              <div key={idx} className="glass-soft rounded-2xl p-3">
                <div className="flex items-center gap-3 mb-3">
                  <div>{previewTile(tile, idx)}</div>
                  <div className="flex-1 min-w-0">
                    <div className="text-[11px] uppercase tracking-wider text-white/40 mb-1">Плитка #{idx + 1}</div>
                    <div className="text-[11px] text-white/50">Определи доминирующий цвет и введи hex</div>
                    <input
                      value={taskAnswers[idx] || ''}
                      onChange={(e) => {
                        const v = e.target.value;
                        const arr = [...taskAnswers];
                        arr[idx] = v;
                        setTaskAnswers(arr);
                      }}
                      placeholder="#3FA9F5"
                      className="glass-input w-full rounded-xl px-3 py-2 mt-2 outline-none font-mono text-sm uppercase"
                      maxLength={7}
                      spellCheck={false}
                    />
                  </div>
                </div>
              </div>
            ))}
          </div>

          {error && <Alert>{error}</Alert>}

          <button onClick={submitAnswer} disabled={checking}
            className="btn-primary relative overflow-hidden w-full py-3.5 rounded-2xl text-sm font-medium mt-4">
            {checking && <span className="load-bar"/>}
            <span className={checking ? 'opacity-70' : ''}>{checking ? 'Проверка…' : 'Проверить ответы'}</span>
          </button>

          {result && (
            <div className={`mt-4 p-4 rounded-2xl border ${result.ok ? 'bg-emerald-400/10 border-emerald-400/20' : 'bg-amber-400/10 border-amber-400/20'}`}>
              <div className={`text-sm font-semibold ${result.ok ? 'text-emerald-300' : 'text-amber-300'}`}>
                {result.ok ? `Верно! +${formatLuk(result.rewardLuk)} LUK` : `${result.correct} из ${result.total} верно`}
              </div>
              <div className="text-[11px] text-white/60 mt-1">
                Награда за байт: {result.rewardPerByte.toFixed(2)} LUK
              </div>
            </div>
          )}
        </div>
      )}

      {history.length > 0 && (
        <div className="glass rounded-3xl p-5">
          <div className="text-[11px] uppercase tracking-[0.16em] text-white/45 mb-3">История майнинга</div>
          <div className="space-y-2 max-h-72 overflow-y-auto scrollbar-thin pr-1">
            {history.map(h => (
              <div key={h.id} className="flex items-center justify-between p-3 rounded-2xl glass-soft text-sm">
                <div className="min-w-0">
                  <div className="truncate">{h.kind === 'mining_reward' ? 'Награда за майнинг' : 'Вывод на кошелёк'}</div>
                  <div className="text-[11px] text-white/45 truncate">{h.note}</div>
                </div>
                <div className={`shrink-0 font-semibold ${h.kind === 'mining_reward' ? 'text-emerald-300' : 'text-amber-300'}`}>
                  {h.kind === 'mining_reward' ? '+' : '−'}{formatLuk(Math.abs(h.amount))} LUK
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

/* ============================================================
   Home Tab
   ============================================================ */

function HomeTab({ user, balance, onCopy, refresh, refreshUser }) {
  const [showSend, setShowSend] = useState(false);
  const [sendTo, setSendTo] = useState('');
  const [sendAmount, setSendAmount] = useState('');
  const [sendNote, setSendNote] = useState('');
  const [sendError, setSendError] = useState('');
  const [sending, setSending] = useState(false);
  const [biometricConfirmed, setBiometricConfirmed] = useState(false);

  const TRANSFER_FEE = 0.05;

  const parsedAmount = parseFloat(String(sendAmount).replace(',', '.'));
  const feeAmount = isFinite(parsedAmount) && parsedAmount > 0 ? parsedAmount * TRANSFER_FEE : 0;
  const totalDebit = isFinite(parsedAmount) && parsedAmount > 0 ? parsedAmount + feeAmount : 0;

  const requestBiometric = async () => {
    setSendError('');
    try {
      const ok = await verifyBiometric(user.webauthnId);
      if (!ok) { setSendError('Биометрия не подтверждена.'); return; }
      setBiometricConfirmed(true);
    } catch {
      setSendError('Не удалось подтвердить биометрию.');
    }
  };

  const doSend = async () => {
    setSendError('');
    const amt = parseFloat(String(sendAmount).replace(',', '.'));
    if (!sendTo.trim()) { setSendError('Введи адрес получателя.'); return; }
    if (!amt || amt <= 0) { setSendError('Введи корректную сумму.'); return; }

    const cleanTo = sanitize(sendTo, 120);

    if (cleanTo === user.id) {
      setSendError('Нельзя переводить на свой адрес.');
      return;
    }

    if (!biometricConfirmed) {
      setSendError('Подтверди перевод биометрией.');
      return;
    }

    const fee = amt * TRANSFER_FEE;
    const total = amt + fee;

    if (total > balance) { setSendError('Недостаточно средств с учётом комиссии 5%.'); return; }

    const limit = user.transferLimit ?? 1000000;
    if (amt > limit) {
      setSendError(`Превышен лимит на переводы. Доступно: ${formatLuk(limit)} LUK.`);
      return;
    }

    setSending(true);
    await wait(400);

    const cleanNote = sanitize(sendNote, 140);
    const newBalance = balance - total;
    const newLimit = limit - amt;

    run('UPDATE users SET luk_balance = ?, transfer_limit = ? WHERE id = ?',
      [newBalance, newLimit, user.id]);
    run('INSERT INTO transactions (id, user_id, kind, amount, counterparty, note, ts) VALUES (?, ?, ?, ?, ?, ?, ?)',
      [uuid(), user.id, 'send', -amt, cleanTo, cleanNote, Date.now()]);
    run('INSERT INTO transactions (id, user_id, kind, amount, counterparty, note, ts) VALUES (?, ?, ?, ?, ?, ?, ?)',
      [uuid(), user.id, 'send_fee', -fee, 'LUK Protocol', 'Комиссия 5% за перевод', Date.now()]);

    await audit('send', `amt=${amt} fee=${fee}`);
    await persistDB();
    setSending(false);
    setSendTo(''); setSendAmount(''); setSendNote('');
    setBiometricConfirmed(false);
    setShowSend(false);
    refresh();
    refreshUser?.();
  };

  const closeSheet = () => {
    if (sending) return;
    setShowSend(false);
    setBiometricConfirmed(false);
    setSendError('');
  };

  return (
    <div className="fade-up flex-1 flex flex-col gap-4">
      <div className="glass rounded-3xl p-6 sm:p-7 shadow-glow">
        <div className="text-[11px] uppercase tracking-[0.16em] text-white/45 mb-2">Баланс</div>
        <div className="flex items-end gap-2 mb-1 min-w-0 flex-wrap">
          <div className="text-4xl sm:text-5xl font-bold tracking-tight truncate">
            {formatLuk(balance)}
          </div>
          <div className="text-lg font-semibold text-amber-300 mb-1.5">LUK</div>
        </div>
        <div className="flex items-center gap-2 text-[12px] text-white/50 mb-5">
          <Icon name="trend" size={14}/>
          <span>Переводы: комиссия 5% · P2P: комиссия с продавца</span>
        </div>

        <div className="grid grid-cols-2 gap-2">
          <button onClick={() => setShowSend(true)}

function HistoryTab({ txs, onSelect }) {

  const [loadingMore, setLoadingMore] = useState(false);

  const visible = useMemo(() => txs.slice(0, visibleCount), [txs, visibleCount]);
  const hasMore = visibleCount < txs.length;

  const showMore = () => {
    setLoadingMore(true);
    setTimeout(() => {
      setVisibleCount(c => Math.min(txs.length, c + 5));
      setLoadingMore(false);
    }, 320);
  };

              <Icon name="history" size={26}/>
            </div>
            <div className="text-sm text-white/60 mb-1">Операций пока нет</div>
          </div>
        ) : (
          <div className="space-y-2">
            {visible.map(t => {

              return (
                <button key={t.id} onClick={() => onSelect(t)}
                  className="list-in w-full text-left flex items-center gap-3 p-3 rounded-2xl glass-soft hover:bg-white/8 transition min-w-0">
                  <div className={`w-10 h-10 shrink-0 rounded-xl flex items-center justify-center

                    <Icon name={

                      t.kind === 'p2p_buy' ? 'cart' :
                      t.kind === 'p2p_sell' ? 'tag' :
                      t.kind === 'p2p_commission' ? 'trend' :
                      t.kind === 'p2p_limit_bonus' ? 'medal' :
                      t.kind === 'mining_reward' ? 'pickaxe' :

                  <div className={`shrink-0 text-sm font-semibold

/* ============================================================
   Price Chart (не изменён)
   ============================================================ */

function PriceChart({ points }) {
  const canvasRef = useRef(null);
  const wrapRef = useRef(null);
  const [zoom, setZoom] = useState(1);
  const [offset, setOffset] = useState(0);
  const dragRef = useRef({ active: false, lastX: 0, pinchDist: 0, pinchZoom: 1 });

  const cleanPoints = useMemo(() => {
    if (!points || !points.length) return [];
    return points.filter(p => p && isFinite(p.rate) && p.rate > 0).sort((a, b) => a.ts - b.ts);
  }, [points]);

  const visiblePoints = useMemo(() => {
    if (cleanPoints.length < 2) return cleanPoints;
    const count = Math.max(2, Math.round(cleanPoints.length / zoom));
    const maxOffset = Math.max(0, cleanPoints.length - count);
    const start = Math.min(maxOffset, Math.max(0, Math.round(offset)));
    return cleanPoints.slice(start, start + count);
  }, [cleanPoints, zoom, offset]);

  const maxOffset = useMemo(() => {
    if (cleanPoints.length < 2) return 0;
    const count = Math.max(2, Math.round(cleanPoints.length / zoom));
    return Math.max(0, cleanPoints.length - count);
  }, [cleanPoints, zoom]);

  const clampOffset = (v) => Math.max(0, Math.min(maxOffset, v));

  const draw = useCallback(() => {
    const canvas = canvasRef.current;
    const wrap = wrapRef.current;
    if (!canvas || !wrap) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = wrap.clientWidth;
    const h = wrap.clientHeight;
    if (w === 0 || h === 0) return;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    if (!visiblePoints || visiblePoints.length < 2) {
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.font = '12px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('Нет данных о курсе', w / 2, h / 2);
      return;
    }

    const values = visiblePoints.map(p => p.rate);
    const minV = Math.min(...values);
    const maxV = Math.max(...values);
    const range = maxV - minV;
    const padV = range > 0 ? range * 0.15 : Math.max(maxV * 0.02, 0.05);
    const lo = Math.max(0, minV - padV);
    const hi = maxV + padV;
    const span = hi - lo || 1;

    const padL = 10, padR = 70, padT = 16, padB = 24;
    const plotW = w - padL - padR;
    const plotH = h - padT - padB;
    const stepX = plotW / Math.max(1, visiblePoints.length - 1);
    const yFor = v => padT + plotH - ((v - lo) / span) * plotH;

    ctx.font = '10px Inter, sans-serif';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    for (let i = 0; i <= 4; i++) {
      const y = padT + (plotH * i) / 4;
      ctx.strokeStyle = 'rgba(255,255,255,0.06)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(padL, y);
      ctx.lineTo(padL + plotW, y);
      ctx.stroke();

      const v = lo + ((span) * (4 - i)) / 4;
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.fillText(v.toFixed(2) + ' ₽', padL + plotW + 6, y);
    }

    const gradient = ctx.createLinearGradient(0, padT, 0, padT + plotH);
    gradient.addColorStop(0, 'rgba(129,140,248,0.35)');
    gradient.addColorStop(1, 'rgba(129,140,248,0)');

    ctx.beginPath();
    visiblePoints.forEach((p, i) => {
      const x = padL + i * stepX;
      const y = yFor(p.rate);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.lineTo(padL + (visiblePoints.length - 1) * stepX, padT + plotH);
    ctx.lineTo(padL, padT + plotH);
    ctx.closePath();
    ctx.fillStyle = gradient;
    ctx.fill();

    const lineGrad = ctx.createLinearGradient(padL, 0, padL + plotW, 0);
    lineGrad.addColorStop(0, '#818cf8');
    lineGrad.addColorStop(0.5, '#c084fc');
    lineGrad.addColorStop(1, '#38bdf8');
    ctx.strokeStyle = lineGrad;
    ctx.lineWidth = 2.2;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    visiblePoints.forEach((p, i) => {
      const x = padL + i * stepX;
      const y = yFor(p.rate);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.stroke();

    const last = visiblePoints[visiblePoints.length - 1];
    const lx = padL + (visiblePoints.length - 1) * stepX;
    const ly = yFor(last.rate);

    ctx.strokeStyle = 'rgba(56,189,248,0.35)';
    ctx.setLineDash([4, 4]);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padL, ly);
    ctx.lineTo(padL + plotW, ly);
    ctx.stroke();
    ctx.setLineDash([]);

    const glow = ctx.createRadialGradient(lx, ly, 0, lx, ly, 14);
    glow.addColorStop(0, 'rgba(56,189,248,0.8)');
    glow.addColorStop(1, 'rgba(56,189,248,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(lx, ly, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#38bdf8';
    ctx.beginPath();
    ctx.arc(lx, ly, 3.5, 0, Math.PI * 2);
    ctx.fill();

    const badgeText = last.rate.toFixed(2) + ' ₽';
    ctx.font = 'bold 11px Inter, sans-serif';
    const tw = ctx.measureText(badgeText).width;
    const bw = Math.max(tw + 14, 54);
    const bh = 20;
    const bx = padL + plotW + 4;
    const by = Math.max(2, Math.min(h - bh - 2, ly - bh / 2));

    ctx.fillStyle = 'rgba(56,189,248,0.95)';
    const r = 5;
    ctx.beginPath();
    ctx.moveTo(bx + r, by);
    ctx.lineTo(bx + bw - r, by);
    ctx.quadraticCurveTo(bx + bw, by, bx + bw, by + r);
    ctx.lineTo(bx + bw, by + bh - r);
    ctx.quadraticCurveTo(bx + bw, by + bh, bx + bw - r, by + bh);
    ctx.lineTo(bx + r, by + bh);
    ctx.quadraticCurveTo(bx, by + bh, bx, by + bh - r);
    ctx.lineTo(bx, by + r);
    ctx.quadraticCurveTo(bx, by, bx + r, by);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#04050a';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(badgeText, bx + 7, by + bh / 2);
  }, [visiblePoints]);

  useEffect(() => { draw(); }, [draw]);

  useEffect(() => {
    const onResize = () => draw();
    window.addEventListener('resize', onResize);
    const t = setTimeout(draw, 100);
    return () => {
      window.removeEventListener('resize', onResize);
      clearTimeout(t);
    };
  }, [draw]);

  const onPointerDown = (e) => {
    dragRef.current.active = true;
    dragRef.current.lastX = e.clientX;
    e.currentTarget.setPointerCapture?.(e.pointerId);
  };
  const onPointerMove = (e) => {
    if (!dragRef.current.active) return;
    const dx = e.clientX - dragRef.current.lastX;
    dragRef.current.lastX = e.clientX;
    const wrap = wrapRef.current;
    if (!wrap) return;
    const plotW = wrap.clientWidth - 10 - 70;
    const stepPx = plotW / Math.max(2, visiblePoints.length - 1);
    const pointsPerPx = 1 / Math.max(1, stepPx);
    const delta = -dx * pointsPerPx * (cleanPoints.length / Math.max(1, visiblePoints.length)) * 0.35;
    setOffset(o => clampOffset(o + delta));
  };
  const onPointerUp = (e) => {
    dragRef.current.active = false;
    e.currentTarget.releasePointerCapture?.(e.pointerId);
  };
  const onWheel = (e) => {
    if (e.ctrlKey || e.metaKey) {
      e.preventDefault();
      const factor = e.deltaY > 0 ? 0.9 : 1.1;
      setZoom(z => Math.max(1, Math.min(20, z * factor)));
    } else {
      const delta = e.deltaY * 0.02;
      setOffset(o => clampOffset(o + delta));
    }
  };

  const onTouchStart = (e) => {
    if (e.touches.length === 2) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      dragRef.current.pinchDist = Math.hypot(dx, dy);
      dragRef.current.pinchZoom = zoom;
    }
  };
  const onTouchMove = (e) => {
    if (e.touches.length === 2 && dragRef.current.pinchDist) {
      e.preventDefault();
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const dist = Math.hypot(dx, dy);
      const ratio = dist / dragRef.current.pinchDist;
      setZoom(z => Math.max(1, Math.min(20, dragRef.current.pinchZoom * ratio)));
    }
  };
  const onTouchEnd = () => { dragRef.current.pinchDist = 0; };

  const reset = () => { setZoom(1); setOffset(0); };

  return (
    <div>
      <div className="flex items-center justify-between gap-2 mb-3">
        <div className="min-w-0">
          <div className="text-[11px] uppercase tracking-[0.16em] text-white/45">График курса</div>
          <div className="text-sm font-medium mt-0.5">LUK / RUB</div>
        </div>
        <div className="flex items-center gap-1 shrink-0">
          <button onClick={() => setZoom(z => Math.min(20, z * 1.25))}
            className="p-2 rounded-xl glass-soft text-white/60 hover:text-white transition">
            <Icon name="zoomIn" size={14}/>
          </button>
          <button onClick={() => setZoom(z => Math.max(1, z / 1.25))}
            className="p-2 rounded-xl glass-soft text-white/60 hover:text-white transition">
            <Icon name="zoomOut" size={14}/>
          </button>
          <button onClick={reset}
            className="p-2 rounded-xl glass-soft text-white/60 hover:text-white transition">
            <Icon name="reset" size={14}/>
          </button>
        </div>
      </div>

      <div ref={wrapRef}
        className="chart-wrap glass-soft rounded-2xl relative"
        style={{ height: 220 }}
        onPointerDown={onPointerDown}
        onPointerMove={onPointerMove}
        onPointerUp={onPointerUp}
        onPointerLeave={onPointerUp}
        onWheel={onWheel}
        onTouchStart={onTouchStart}
        onTouchMove={onTouchMove}
        onTouchEnd={onTouchEnd}>
        <canvas ref={canvasRef} className="absolute inset-0 w-full h-full"/>
      </div>

      <div className="mt-2 flex items-center justify-between text-[10px] text-white/40">
        <span>Зажми и тяни · колесо · pinch для зума</span>
        <span className="font-mono">×{zoom.toFixed(1)}</span>
      </div>
    </div>
  );
}

    setOrders(allOrders);
    const mine = queryAll('SELECT * FROM p2p_orders WHERE seller_id = ? ORDER BY created_at DESC LIMIT 50', [user.id]);
    setMyOrders(mine);

      `SELECT * FROM p2p_deals WHERE buyer_id = ? OR seller_id = ? ORDER BY updated_at DESC LIMIT 100`,

    );

      `SELECT * FROM p2p_deals WHERE status = 'pending' AND deadline_at IS NOT NULL AND deadline_at < ?`,
      [now]

    expired.forEach(deal => {

      const commissionLuk = deal.luk_amount * 0.05;

      run(`UPDATE p2p_deals SET status = 'completed', commission = ?, auto_executed = 1,
           seller_response_sec = ?, updated_at = ? WHERE id = ?`,
        [commission, Math.round((now - deal.created_at) / 1000), now, deal.id]);

      run('UPDATE users SET luk_balance = luk_balance + ? WHERE id = ?', [deal.luk_amount, deal.buyer_id]);
      run('INSERT INTO transactions (id, user_id, kind, amount, counterparty, note, ts) VALUES (?, ?, ?, ?, ?, ?, ?)',
